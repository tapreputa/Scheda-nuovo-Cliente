<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Recensioni</title>
<style>html,body{margin:0;width:100%;height:100%;font-family:Arial;background:#f5f8f7}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#status{padding:24px;text-align:center;color:#173d34}</style></head>
<body><div id="status">Apertura pagina…</div>
<script src="tap-manual-page-viewport.js?v=20261009-page-background3"></script>
<script>
(async()=>{
  const slug=new URLSearchParams(location.search).get('c')||'';
  if(!/^[a-z0-9-]{1,80}$/.test(slug)) throw new Error('Link non valido.');
  const key='sb_publishable_Hc_FOVPSOkuNC-mz25VknA_5O0fWJ6p';
  const response=await fetch('https://rqzgdgdoulgjwlxtdxhi.supabase.co/rest/v1/rpc/get_public_manual_logo_page',{
    method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:slug})
  });
  if(!response.ok) throw new Error('Pagina non disponibile.');
  const rows=await response.json();
  if(!rows[0]?.html) throw new Error('Pagina non disponibile.');
  const frame=document.createElement('iframe');
  frame.title='Pagina recensioni';
  // Static snapshot: no scripts or same-origin privileges in public content.
  frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
  // Keep the exact saved composition (layout, pixels and editable positions).
  // Repair only legacy Google Maps review href values from their Place ID.
  const savedHtml=rows[0].html;
  const html=savedHtml.replace(/href=(["'])(https:\/\/[^"']+)\1/gi,(original,quote,encodedUrl)=>{
    const rawUrl=encodedUrl.replace(/&amp;/gi,'&');
    try{
      const url=new URL(rawUrl);
      if(!/(^|\.)google\.com$/.test(url.hostname))return original;
      const placeId=url.searchParams.get('placeid')||url.searchParams.get('query_place_id');
      if(!placeId||!/^ChI[A-Za-z0-9_-]{10,}$/.test(placeId))return original;
      return 'href='+quote+'https://search.google.com/local/writereview?placeid='+encodeURIComponent(placeId)+quote;
    }catch(_){return original;}
  });
  // Edit link attributes as DOM, not using fragile regex substitutions.
  // Saved CSS and coordinates are preserved byte-for-byte.
  const documentForLinks=new DOMParser().parseFromString(html,'text/html');
  documentForLinks.querySelectorAll('a[href]').forEach(anchor=>{
    try{
      const link=new URL(anchor.getAttribute('href').replace(/&amp;/gi,'&'),location.href);
      if(link.hostname==='search.google.com' && link.pathname==='/local/writereview'){
        anchor.setAttribute('target','_blank');
        anchor.setAttribute('rel','noopener noreferrer');
      }
    }catch(_){}
  });
  const navigableHtml='<!doctype html>\n'+documentForLinks.documentElement.outerHTML;
  frame.srcdoc=navigableHtml;
  document.body.replaceChildren(frame);
  TapManualPageViewport.mount(frame, navigableHtml);
})().catch(e=>{document.getElementById('status').textContent=e.message;});
</script></body></html>
