<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>Targa NFC | Gestione clienti</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f8fb;
      --card: rgba(255,255,255,.94);
      --text: #15171a;
      --muted: #6f747c;
      --line: #e6e8ec;
      --dark: #17191c;
      --dark-hover: #292c31;
      --shadow: 0 20px 60px rgba(20, 24, 32, .08);
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0, #fafbfc 35%, var(--bg) 72%);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 28px 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--dark);
      position: relative;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      border: 2px solid #fff;
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(45deg);
    }

    .brand-mark::before {
      width: 8px;
      height: 8px;
      left: 7px;
      top: 8px;
    }

    .brand-mark::after {
      width: 14px;
      height: 14px;
      left: 4px;
      top: 5px;
      opacity: .75;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 24px 110px;
    }

    .hero {
      width: min(100%, 720px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 750;
    }

    .subtitle {
      max-width: 650px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2.2vw, 20px);
      line-height: 1.55;
      letter-spacing: -.012em;
    }

    

    

    

    

    

    footer {
      text-align: center;
      padding: 20px 24px 30px;
      color: #9a9ea5;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 22px 20px; }
      main { padding: 25px 20px 80px; }
      .subtitle { margin-top: 20px; }
      
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="brand" aria-label="Targa NFC">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>TARGA NFC</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Il tuo pannello clienti</h1>

        <p class="subtitle">
          Crea link permanenti, pagine personalizzate e card pronte da consegnare
          senza tornare dal cliente.
        </p>

      </section>
    </main>

    <footer>Targa NFC</footer>
  </div>
</body>
</html>
