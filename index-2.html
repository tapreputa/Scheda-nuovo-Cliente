<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003d33">
  <title>Targa NFC · Gestione clienti</title>
  <style>
    :root{
      --green-950:#003c33;
      --green-900:#00493d;
      --green-700:#007f69;
      --green-600:#009477;
      --green-100:#dff4ef;
      --ink:#0f2824;
      --muted:#7b8582;
      --line:#d6dfdc;
      --bg:#f2f7f5;
      --white:#fff;
      --shadow:0 18px 45px rgba(12,45,39,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
    body{background:linear-gradient(180deg,#f5f9f8 0%,#eff6f3 100%);-webkit-font-smoothing:antialiased}

    .topbar{
      height:96px;background:var(--green-950);color:#fff;display:flex;align-items:center;
      justify-content:space-between;padding:0 28px;box-shadow:0 1px 0 rgba(255,255,255,.05)
    }
    .brand{display:flex;align-items:center;gap:16px}
    .brand-icon{
      width:54px;height:54px;border-radius:14px;background:linear-gradient(145deg,#009b7d,#007963);
      display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.13)
    }
    .brand-icon svg{width:31px;height:31px}
    .brand-title{font-size:20px;font-weight:800;line-height:1.05}
    .brand-sub{font-size:15px;color:#b9cbc7;margin-top:7px}
    .user-pill{
      border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:999px;
      padding:13px 20px;font-size:15px;font-weight:650;white-space:nowrap
    }

    .wrap{max-width:1190px;margin:0 auto;padding:50px 36px 80px}
    .eyebrow{
      color:var(--green-700);font-size:14px;letter-spacing:.22em;font-weight:850;
      text-transform:uppercase;margin-bottom:22px
    }
    h1{font-size:48px;line-height:1.05;letter-spacing:-.04em;font-weight:500;margin:0 0 50px}

    .steps{
      display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:16px;
      margin-bottom:30px;color:#a2aaa7;font-size:15px;font-weight:750
    }
    .step.active{color:var(--green-700)}
    .rule{height:1px;background:#cdd8d4}

    .card{
      background:var(--white);border:1px solid #dbe3e0;border-radius:28px;padding:46px 38px 34px;
      box-shadow:var(--shadow)
    }
    .card-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:38px}
    .card-icon{
      width:62px;height:62px;border-radius:20px;background:var(--green-100);display:grid;place-items:center;flex:0 0 auto
    }
    .card-icon svg{width:32px;height:32px;stroke:var(--green-700)}
    .card-head h2{margin:0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.025em}
    .card-head p{margin:12px 0 0;color:#7e8583;font-size:19px}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .field{margin-bottom:23px}
    label{display:block;font-size:15px;font-weight:800;margin:0 0 10px}
    .label-row{display:flex;align-items:center;gap:8px}
    .key-icon{width:20px;height:20px}
    input{
      width:100%;height:62px;border:2px solid #d1dbd7;border-radius:16px;background:#fff;color:#19312c;
      padding:0 18px;font:inherit;font-size:16px;outline:none;transition:.15s
    }
    input::placeholder{color:#9ba3a1;font-weight:600}
    input:focus{border-color:#0c9b80;box-shadow:0 0 0 4px rgba(12,155,128,.10)}
    .hint{font-size:14px;color:#848d8a;margin-top:10px}

    .primary{
      width:100%;height:67px;border:0;border-radius:16px;background:var(--green-600);color:#fff;
      display:flex;align-items:center;justify-content:center;gap:11px;font-size:17px;font-weight:800;cursor:pointer;
      transition:filter .15s,transform .15s
    }
    .primary:hover{filter:brightness(.95);transform:translateY(-1px)}
    .primary svg{width:23px;height:23px}

    .message{display:none;margin-top:15px;padding:14px 16px;border-radius:14px;font-size:14px}
    .message.show{display:block}
    .message.warn{background:#fff7e8;color:#7b5410;border:1px solid #f0d6a4}
    .message.ok{background:#eaf8f4;color:#096450;border:1px solid #b8e4d8}

    .divider{height:1px;background:#dde5e2;margin:30px 0 0}
    .accordion-btn{
      width:100%;border:0;background:transparent;padding:25px 5px 8px;display:flex;align-items:center;gap:12px;
      color:#006f5d;font:inherit;font-size:18px;font-weight:800;cursor:pointer;text-align:left
    }
    .chev{transition:transform .2s}
    .accordion-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
    .accordion-content{display:none;padding:16px 5px 4px}
    .accordion-content.open{display:block}
    .place-row{display:grid;grid-template-columns:1fr auto;gap:12px}
    .secondary{
      height:62px;border:1px solid #0a8e75;background:#effaf7;color:#08735f;padding:0 20px;border-radius:16px;
      font-weight:800;cursor:pointer
    }

    @media(max-width:760px){
      .topbar{height:84px;padding:0 18px}
      .brand{gap:12px}.brand-icon{width:46px;height:46px;border-radius:13px}
      .brand-title{font-size:18px}.brand-sub{font-size:13px;margin-top:5px}
      .user-pill{padding:10px 14px;font-size:13px}
      .wrap{padding:34px 18px 55px}
      .eyebrow{font-size:12px;margin-bottom:18px}
      h1{font-size:39px;margin-bottom:36px}
      .steps{grid-template-columns:auto 1fr auto 1fr auto;gap:8px;font-size:12px;margin-bottom:22px}
      .step{white-space:nowrap}.step span{display:none}
      .card{border-radius:23px;padding:28px 20px 24px}
      .card-head{gap:14px;margin-bottom:28px}.card-icon{width:52px;height:52px;border-radius:17px}
      .card-head h2{font-size:26px}.card-head p{font-size:16px;line-height:1.45;margin-top:8px}
      .grid2{grid-template-columns:1fr;gap:0}
      input{height:58px}
      .primary{height:61px}
      .place-row{grid-template-columns:1fr}
      .secondary{width:100%}
    }
    @media(max-width:440px){
      .user-pill{display:none}
      h1{font-size:36px}
      .steps{font-size:11px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7 8.5a5 5 0 0 1 0 7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4.6 6a8.4 8.4 0 0 1 0 12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9.6 10.4a2.3 2.3 0 0 1 0 3.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13.2 6.8a7.4 7.4 0 0 1 0 10.4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M16.2 4.5a10.5 10.5 0 0 1 0 15" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">Targa NFC</div>
        <div class="brand-sub">Gestione clienti</div>
      </div>
    </div>
    <div class="user-pill">Francesco Terreno</div>
  </header>

  <main class="wrap">
    <div class="eyebrow">Nuovo cliente</div>
    <h1>Trova l’attività</h1>

    <div class="steps" aria-label="Avanzamento">
      <div class="step active">1. <span>Attività</span></div>
      <div class="rule"></div>
      <div class="step">2. <span>Personalizza</span></div>
      <div class="rule"></div>
      <div class="step">3. <span>Consegna</span></div>
    </div>

    <section class="card">
      <div class="card-head">
        <div class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z" stroke-width="1.8"/>
            <circle cx="12" cy="9" r="2.4" stroke-width="1.8"/>
          </svg>
        </div>
        <div>
          <h2>Cerca su Google</h2>
          <p>Inserisci il nome dell’attività e il suo indirizzo.</p>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="business">Nome attività</label>
          <input id="business" autocomplete="organization" placeholder="Es. Maxim Bar">
        </div>
        <div class="field">
          <label for="address">Indirizzo e città</label>
          <input id="address" autocomplete="street-address" placeholder="Via Roma 174, Isola delle Femmine">
        </div>
      </div>

      <div class="field">
        <label class="label-row" for="apikey">
          <svg class="key-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="15.5" r="3.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="m11 13 7-7m-2 2 2 2m-5-5 2 2M5.8 18.2 3 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Chiave Google Places API
        </label>
        <input id="apikey" type="password" autocomplete="off" placeholder="Non viene salvata">
        <div class="hint">La chiave rimane soltanto in questa pagina.</div>
      </div>

      <button class="primary" id="searchBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.6" stroke="white" stroke-width="2"/>
          <path d="m16 16 4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Trova attività
      </button>
      <div id="msg" class="message"></div>

      <div class="divider"></div>

      <button class="accordion-btn" id="placeToggle" type="button" aria-expanded="false">
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Possiedo già il Place ID
      </button>

      <div class="accordion-content" id="placeContent">
        <div class="field">
          <label for="placeid">Google Place ID</label>
          <div class="place-row">
            <input id="placeid" placeholder="Es. ChIJ...">
            <button class="secondary" id="usePlaceId" type="button">Usa Place ID</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const toggle = document.getElementById('placeToggle');
    const content = document.getElementById('placeContent');
    const msg = document.getElementById('msg');

    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      content.classList.toggle('open', !open);
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const business = document.getElementById('business').value.trim();
      const address = document.getElementById('address').value.trim();
      const apiKey = document.getElementById('apikey').value.trim();

      msg.className = 'message show';
      if (!business || !address) {
        msg.classList.add('warn');
        msg.textContent = 'Inserisci il nome dell’attività e l’indirizzo.';
        return;
      }
      if (!apiKey) {
        msg.classList.add('warn');
        msg.textContent = 'Inserisci una chiave Google Places API per effettuare una ricerca automatica.';
        return;
      }

      msg.classList.add('ok');
      msg.textContent = 'Interfaccia pronta. Nel prossimo passaggio collegheremo la ricerca reale a Google Places.';
    });

    document.getElementById('usePlaceId').addEventListener('click', () => {
      const placeId = document.getElementById('placeid').value.trim();
      msg.className = 'message show ' + (placeId ? 'ok' : 'warn');
      msg.textContent = placeId
        ? 'Place ID acquisito. Possiamo usarlo per il passaggio “Personalizza”.'
        : 'Inserisci un Place ID valido.';
    });
  </script>
</body>
</html>
