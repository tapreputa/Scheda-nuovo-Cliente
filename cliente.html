async function load(){
 if(!slug) throw new Error('Link non valido.');
 const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_public_client_by_slug',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_slug:slug})});
 if(!r.ok) throw new Error('Pagina non disponibile.');
 const data=await r.json(); const row=Array.isArray(data)?data[0]:data;
 if(!row||!row.link_recensioni) throw new Error('Cliente non trovato.');
 const cat=row.categoria_codice||''; const text=copy[cat]||['TI È PIACIUTA LA TUA ESPERIENZA?','La tua opinione è importante. Lascia una recensione e aiutaci a migliorare ogni giorno.'];
 const name=document.getElementById('name'); const logo=document.getElementById('logo'); const message=document.getElementById('message'); const page=document.getElementById('page');
 if(row.logo_data){logo.src=row.logo_data;logo.classList.add('show');name.classList.add('hidden');}else{name.textContent=row.nome||'';}
 document.getElementById('headline').textContent=text[0];
 if(text[1]){message.textContent=text[1];message.classList.remove('hidden');}else{message.textContent='';message.classList.add('hidden');}
 document.getElementById('review').href=row.link_recensioni;
 if(cat==='barextra') page.classList.add('barextra');
 if(cat==='abbigliamento') page.classList.add('abbigliamento');
 if(cat==='beb') page.classList.add('beb');
 if(cat==='enoteca') page.classList.add('enoteca');
 if(cat==='fioraio') page.classList.add('fioraio');
 if(cat==='fotografo') page.classList.add('fotografo');
 if(cat==='hotel') page.classList.add('hotel');
 if(cat==='studiotatuaggi') page.classList.add('studiotatuaggi');
 if(cat==='petfood') page.classList.add('petfood');
 if(cat==='toelettaturacani') page.classList.add('toelettaturacani');
 const background=bg[cat]||'Sfondobar.png';
 page.style.backgroundImage='url("'+background+'")';
 document.getElementById('loading').classList.add('hidden'); page.classList.remove('hidden');
 window.scrollTo(0,0);
}
load().catch(e=>document.getElementById('error').textContent=e.message||'Link non disponibile.');
})();
