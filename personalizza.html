<script>
const operatorSelect = document.getElementById("operatorSelect");
const activityType = document.getElementById("activityType");
const templateInfo = document.getElementById("templateInfo");
const logoFile = document.getElementById("logoFile");
const logoPreview = document.getElementById("logoPreview");
const logoPreviewImg = document.getElementById("logoPreviewImg");
const logoName = document.getElementById("logoName");
const destinationUrl = document.getElementById("destinationUrl");
const msg = document.getElementById("msg");

let logoDataUrl = "";

function normalizeReviewUrl(value) {
  const prefix = "https://search.google.com/local/writereview?placeid=";
  let current = String(value || "").trim();

  if (!current) return "";

  if (current.startsWith(prefix)) {
    let placePart = current.slice(prefix.length);
    for (let i = 0; i < 5 && placePart.startsWith(prefix); i++) {
      placePart = placePart.slice(prefix.length);
    }
    return prefix + placePart;
  }

  return current;
}

const incomingParams = new URLSearchParams(window.location.search);
const incomingReviewUrl = incomingParams.get("reviewurl");
const incomingBusiness = incomingParams.get("business");
const incomingCategory = incomingParams.get("category");
const incomingOperator = incomingParams.get("operator");

if (incomingOperator) {
  operatorSelect.value = incomingOperator;
}

if (incomingReviewUrl) {
  destinationUrl.value = normalizeReviewUrl(incomingReviewUrl);
}

if (incomingBusiness) {
  document.title = "Tap NFC · " + incomingBusiness;
}


activityType.addEventListener("change", () => {
  const templates = {
    standard: ["Standard", "Collegamento diretto alla pagina recensioni Google. Nessun logo e nessuna pagina personalizzata richiesta."],
    bar: ["Bar / Caffetterie", "Sfondobar fisso + layout Indexbar + pulsante con chicchi animati + 5 stelle + Powered by Tapreputa."],
    ristorante: ["Ristoranti", "Sfondoristorante fisso + layout elegante premium + 5 stelle + Powered by Tapreputa."],
    ristorantemare: ["Ristoranti Mare", "Sfondoristorantemare fisso + stile mediterraneo + pulsante premium + 5 stelle + Powered by Tapreputa."],
    pizzeria: ["Pizzerie", "Sfondo pizzeria con forno a legna + stile caldo + pulsante premium + 5 stelle + Powered by Tapreputa."],
    gelateria: ["Gelaterie", "Sfondo gelateria luminoso + stile fresco + pulsante premium + 5 stelle + Powered by Tapreputa."],
    stabilimento: ["Stabilimenti balneari", "Sfondo mare al tramonto + stile tropicale + pulsante premium + 5 stelle + Powered by Tapreputa."],
    parrucchiere: ["Parrucchieri", "Sfondo salone moderno + stile elegante + pulsante premium + 5 stelle + Powered by Tapreputa."],
    barbershop: ["Barber Shop", "Sfondo barber moderno + stile deciso + pulsante premium + 5 stelle + Powered by Tapreputa."],
    centroestetico: ["Centri estetici", "Sfondo wellness luminoso + stile raffinato + pulsante premium + 5 stelle + Powered by Tapreputa."],
    panificio: ["Panificio / Biscottificio", "Sfondo artigianale caldo + layout dedicato senza crop + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    svapostore: ["Svapo Store", "Sfondo fotografico premium teal/viola + layout moderno dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    yogurteria: ["Yogurterie", "Sfondo luminoso turchese + layout fresco dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    detersivi: ["Detersivi e casalinghi", "Sfondo pulito e luminoso + layout dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    farmacia: ["Farmacie", "Sfondo farmacia luminoso + stile professionale + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    fitness: ["Palestre / Fitness", "Sfondo palestra moderno + stile energico + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    pasticceria: ["Pasticcerie", "Sfondo elegante e goloso + stile caldo + pulsante recensioni + 5 stelle + Powered by Tapreputa."],
    pub: ["Pub / Cocktail bar", "Sfondo serale premium + stile blu/ambra + pulsante recensioni + 5 stelle + Powered by Tapreputa."]
  };
  const item = templates[activityType.value];
  if (item) {
    templateInfo.hidden = false;
    templateInfo.innerHTML = `<span>Tipologia selezionata</span><strong>${item[0]}</strong>`;
  } else {
    templateInfo.hidden = true;
    templateInfo.innerHTML = "";
  }

  const isStandard = activityType.value === "standard";
  const logoField = logoFile.closest(".field");
  if (logoField) logoField.style.display = isStandard ? "none" : "";
  logoFile.disabled = isStandard;
  if (isStandard) logoPreview.classList.remove("show");

  const previewButton = document.getElementById("previewBtn");
  if (previewButton) previewButton.textContent = isStandard ? "Anteprima link" : "Anteprima pagina";
});

if (incomingCategory) {
  activityType.value = incomingCategory;
  activityType.dispatchEvent(new Event("change"));
}

logoFile.addEventListener("change", () => {
  const file = logoFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    logoDataUrl = e.target.result;
    logoPreviewImg.src = logoDataUrl;
    logoName.textContent = file.name;
    logoPreview.classList.add("show");
  };
  reader.readAsDataURL(file);
});

document.getElementById("backBtn").onclick = () => location.href = "index.html";


const finalLinkBox = document.getElementById("finalLinkBox");
const finalLinkValue = document.getElementById("finalLinkValue");
const copyFinalBtn = document.getElementById("copyFinalBtn");
const previewBtn = document.getElementById("previewBtn");
const addClientBtn = document.getElementById("addClientBtn");
const generateBtn = document.getElementById("generateBtn");
const finalLinkLabel = document.querySelector(".final-link-label");
let finalNfcUrl = "";

function syncNfcMode() {
  const type = activityType.value;
  const reviewUrl = normalizeReviewUrl(destinationUrl.value);
  destinationUrl.value = reviewUrl;

  finalNfcUrl = "";
  finalLinkValue.textContent = "";
  finalLinkBox.classList.remove("show");
  addClientBtn.classList.remove("show");
  addClientBtn.disabled = false;
  addClientBtn.textContent = "+ Aggiungi cliente";
  previewBtn.classList.remove("show");
  generateBtn.style.display = "";
  msg.className = "message";
  msg.textContent = "";

  if (!type) return;

  if (type === "standard") {
    generateBtn.style.display = "none";
    finalLinkLabel.textContent = "Link diretto Google da scrivere sulla NFC";
    if (!reviewUrl) return warn("Link recensioni non disponibile. Torna alla pagina precedente.");
    finalNfcUrl = reviewUrl;
    finalLinkValue.textContent = finalNfcUrl;
    finalLinkBox.classList.add("show");
    previewBtn.textContent = "Anteprima link";
    previewBtn.classList.add("show");
    addClientBtn.classList.add("show");
    return;
  }

  finalLinkLabel.textContent = "Link pagina personalizzata da scrivere sulla NFC";
  previewBtn.textContent = "Anteprima pagina";
}

activityType.addEventListener("change", syncNfcMode);
syncNfcMode();

function slugifyBusinessName(name) {
  return String(name || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

generateBtn.onclick = () => {
  const type = activityType.value;
  const reviewUrl = normalizeReviewUrl(destinationUrl.value);
  destinationUrl.value = reviewUrl;
  const businessName = incomingBusiness || "";

  if (!operatorSelect.value) return warn("Seleziona l’operatore.");
  if (!type) return warn("Seleziona la tipologia di attività.");
  if (!["standard","bar","ristorante","ristorantemare","pizzeria","gelateria","stabilimento","parrucchiere","barbershop","centroestetico","panificio","svapostore","yogurteria","detersivi","farmacia","fitness","pasticceria","pub"].includes(type)) return warn("Il template master di questa categoria non è ancora stato configurato.");
  if (type !== "standard" && !logoDataUrl) return warn("Carica il logo dell’attività.");
  if (!reviewUrl) return warn("Il link recensioni non è presente.");
  if (!businessName) return warn("Nome attività non disponibile. Torna indietro e inseriscilo.");

  if (type === "standard") {
    finalNfcUrl = reviewUrl;
  } else {
    const slug = slugifyBusinessName(businessName);
    if (!slug) return warn("Non riesco a creare il nome del link finale.");
    finalNfcUrl = "https://tapreputa.github.io/" + slug + "/";
  }

  finalLinkValue.textContent = finalNfcUrl;
  finalLinkBox.classList.add("show");
  previewBtn.classList.toggle("show", type !== "standard");
  msg.className = "message";
  msg.textContent = "";
  addClientBtn.classList.add("show");
};



async function loadBackgroundDataUrl(fileName) {
  const backgroundUrl = new URL(fileName, window.location.href).href;
  const response = await fetch(backgroundUrl, { cache: "no-store" });

  if (!response.ok) {
    throw new Error(fileName + " non trovato");
  }

  const blob = await response.blob();

  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}


function openInlinePreview(previewHtml) {
  let overlay = document.getElementById("tapPreviewOverlay");

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "tapPreviewOverlay";
    overlay.style.cssText = "position:fixed;inset:0;z-index:999999;background:#fff;display:none;flex-direction:column;";

    const topbar = document.createElement("div");
    topbar.style.cssText = "min-height:76px;flex:0 0 auto;background:#003c33;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:2;";

    const title = document.createElement("strong");
    title.textContent = "Anteprima pagina";
    title.style.cssText = "font-size:17px;line-height:1.15;flex:0 1 auto;white-space:nowrap;";

    const close = document.createElement("button");

addClientBtn.addEventListener("click", () => {
  const businessName = incomingBusiness || "";
  const reviewUrl = normalizeReviewUrl(destinationUrl.value);
  destinationUrl.value = reviewUrl;
  const placeIdValue = incomingParams.get("placeid") || "";
  const categoryValue = activityType.options[activityType.selectedIndex]?.text || "";
  const categoryCode = activityType.value || "";
  const operatorValue = operatorSelect.value || "";

  if (!operatorValue) return warn("Seleziona l’operatore.");
  if (!businessName) return warn("Nome attività non disponibile.");
  if (!reviewUrl) return warn("Link recensioni non disponibile.");
  if (!finalNfcUrl) return warn("Genera prima il link finale.");

  const STORAGE_KEY = "tapreputa_clienti_v1";
  const clienti = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  const duplicateIndex = clienti.findIndex(c =>
    c.linkNfc === finalNfcUrl ||
    (c.nome || "").toLowerCase() === businessName.toLowerCase()
  );

  const now = new Date();
  const dataIt = now.toLocaleDateString("it-IT");

  if (duplicateIndex >= 0) {
    const existing = clienti[duplicateIndex];
    existing.nome = businessName;
    existing.operatore = operatorValue;
    existing.categoria = categoryValue;
    existing.categoriaCodice = categoryCode;
    existing.placeId = placeIdValue;
    existing.linkRecensioni = reviewUrl;
    existing.linkNfc = finalNfcUrl;
    existing.data = existing.data || dataIt;
    existing.stato = existing.stato || "Da consegnare";
    clienti[duplicateIndex] = existing;

    localStorage.setItem(STORAGE_KEY, JSON.stringify(clienti));
    addClientBtn.disabled = true;
    addClientBtn.textContent = "Cliente aggiornato ✓";
    msg.className = "message show ok";
    msg.textContent = "Cliente già presente: dati aggiornati in “I miei clienti”.";
    return;
  }

  const maxId = clienti.reduce((max, c) => {
    const n = parseInt(c.id, 10);
    return Number.isFinite(n) ? Math.max(max, n) : max;
  }, 0);

  clienti.push({
    id: String(maxId + 1).padStart(3, "0"),
    nome: businessName,
    operatore: operatorValue,
    categoria: categoryValue,
    categoriaCodice: categoryCode,
    placeId: placeIdValue,
    linkRecensioni: reviewUrl,
    linkNfc: finalNfcUrl,
    data: dataIt,
    stato: "Da consegnare"
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(clienti));

  addClientBtn.disabled = true;
  addClientBtn.textContent = "Cliente aggiunto ✓";
  msg.className = "message show ok";
  msg.textContent = "Cliente aggiunto a “I miei clienti”.";
});

copyFinalBtn.addEventListener("click", async () => {
  if (!finalNfcUrl) return;

  try {
    await navigator.clipboard.writeText(finalNfcUrl);
  } catch {
    const tmp = document.createElement("textarea");
    tmp.value = finalNfcUrl;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand("copy");
    tmp.remove();
  }

  copyFinalBtn.textContent = "Copiato ✓";
  setTimeout(() => copyFinalBtn.textContent = "Copia link", 1800);
});
