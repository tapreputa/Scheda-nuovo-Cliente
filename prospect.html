<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b160d">
<title>Tapreputa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#1d0d06;color:#fff}body{overflow-x:hidden}.pagina{position:relative;width:100%;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;overflow:hidden;padding:8px clamp(20px,6vw,86px) 86px;background-image:url('Sfondobar.png');background-position:center center;background-size:cover;background-repeat:no-repeat}.pagina::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,5,2,.14),rgba(10,4,2,.10) 40%,rgba(0,0,0,.34));z-index:0}.brand,.centro,.recensione,footer{position:relative;z-index:2}.brand{justify-self:center;width:min(68vw,300px);max-width:100%;max-height:180px;display:flex;align-items:flex-start;justify-content:center}.brand.hidden{display:none}.logo{display:block;width:auto;max-width:100%;height:auto;max-height:180px;object-fit:contain;object-position:center top;filter:drop-shadow(0 10px 22px rgba(0,0,0,.62))}.centro{align-self:center;justify-self:center;width:min(100%,780px);margin-top:-2vh;text-align:center}.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;transform:translateY(-24px);margin-bottom:2px;color:#fff;font-size:1.12rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.28;text-shadow:0 2px 8px rgba(0,0,0,.95)}.eyebrow::before,.eyebrow::after{content:"";width:48px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,210,145,.95))}.eyebrow::after{transform:scaleX(-1)}.messaggio-box{width:100%;overflow:hidden;border-radius:25px;background:rgba(18,7,2,.58);border:1px solid rgba(255,205,140,.22);box-shadow:0 14px 34px rgba(0,0,0,.40);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.messaggio{margin:0;padding:clamp(23px,3.3vw,37px);font-size:clamp(1.3rem,3.2vw,2.15rem);line-height:1.32;text-shadow:0 2px 7px rgba(0,0,0,.65)}.recensione{justify-self:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:19px;margin-bottom:clamp(44px,7vh,78px)}.bottone-google{position:relative;min-width:min(86vw,340px);height:72px;padding:0 42px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,235,205,.95);border-radius:16px;background:linear-gradient(180deg,#fffaf3,#f7e4cc 50%,#e6bd90);color:#3b1c0d;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 26px rgba(210,125,45,.25),inset 0 1px 0 rgba(255,255,255,.9);font-size:clamp(1.35rem,3vw,1.65rem);font-weight:800;text-decoration:none}.bottone-google::before{content:"";position:absolute;width:100px;height:160%;left:-140px;top:-30%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:luce 6s ease-in-out infinite}.testo-bottone{position:relative;z-index:5}.chicco{position:absolute;width:11px;height:16px;border-radius:52% 46% 52% 46%;background:linear-gradient(135deg,#8a4a23,#5c2b12 45%,#2a1107);box-shadow:inset 1px 1px 2px rgba(255,205,145,.28),0 2px 4px rgba(0,0,0,.25);opacity:.42}.chicco1{left:17%;top:12px}.chicco2{left:48%;top:36px}.chicco3{right:14%;top:9px}.stelle{color:#ffc107;font-size:clamp(2.1rem,5vw,2.8rem);letter-spacing:.14em;line-height:1;text-shadow:0 0 8px rgba(255,193,7,.70),0 0 22px rgba(255,150,45,.35),0 4px 10px rgba(0,0,0,.45)}footer{position:absolute;right:clamp(20px,6vw,86px);bottom:30px;color:rgba(255,255,255,.92);font-size:.72rem;text-align:right;text-shadow:0 2px 8px rgba(0,0,0,.90)}footer strong{display:block;font-size:1.55rem;line-height:1.05;font-weight:900}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#f5f9f8;color:#17342e;font-size:18px;font-weight:800;z-index:50}.error{padding:24px;text-align:center}.error strong{display:block;font-size:22px;margin-bottom:8px}@keyframes luce{0%,65%{left:-140px;opacity:0}72%{opacity:.65}90%,100%{left:110%;opacity:0}}@media(max-width:600px){.pagina{min-height:100svh;padding:max(6px,env(safe-area-inset-top)) 18px max(82px,env(safe-area-inset-bottom))}.brand{width:min(66vw,270px);max-height:145px}.logo{max-height:145px}.centro{width:100%;margin-top:-4vh}.eyebrow{transform:translateY(-12px);gap:10px;font-size:clamp(.78rem,3.8vw,.95rem);letter-spacing:.09em}.eyebrow::before,.eyebrow::after{width:clamp(18px,7vw,34px)}.messaggio-box{border-radius:21px}.messaggio{padding:21px 20px;font-size:clamp(1.20rem,5vw,1.48rem)}.recensione{gap:16px;margin-bottom:44px}.bottone-google{width:min(88vw,340px);min-width:0;height:66px;padding:0 24px;font-size:1.34rem}.stelle{font-size:clamp(2rem,8vw,2.55rem)}footer{right:18px;bottom:max(27px,env(safe-area-inset-bottom));font-size:.70rem}footer strong{font-size:1.38rem}}
</style>
</head>
<body>
<div id="loading" class="loading">Apertura pagina…</div>
<main id="page" class="pagina" hidden>
  <div id="brand" class="brand"><img id="logo" class="logo" alt="Logo attività"></div>
  <section class="centro"><div class="eyebrow">Ti è piaciuto il nostro caffè?</div><div class="messaggio-box"><p class="messaggio">La tua opinione ci aiuta a rendere ogni pausa ancora più piacevole. Dicci la tua! Bastano 2 secondi!</p></div></section>
  <section class="recensione"><a id="review" class="bottone-google" target="_blank" rel="noopener noreferrer"><span class="chicco chicco1"></span><span class="chicco chicco2"></span><span class="chicco chicco3"></span><span class="testo-bottone">Recensione Google</span></a><div class="stelle" aria-label="5 stelle">★★★★★</div></section>
  <footer>Powered by <strong>Tapreputa</strong></footer>
</main>
<script>
(async()=>{
  const SUPABASE_URL='https://rqzgdgdoulgjwlxtdxhi.supabase.co';
  const KEY='sb_publishable_Hc_FOVPSOkuNC-mz25VknA_5O0fWJ6p';
  const token=new URLSearchParams(location.search).get('p')||'';
  const loading=document.getElementById('loading');
  try{
    if(!token) throw new Error('Link non valido.');
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_public_prospect',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
    if(!r.ok) throw new Error('Link non disponibile.');
    const rows=await r.json();
    const data=Array.isArray(rows)?rows[0]:rows;
    if(!data) throw new Error('Potenziale non trovato.');
    if(data.categoria_codice!=='bar') throw new Error('Questa categoria è ancora in preparazione.');
    document.title=(data.nome||'Attività')+' · Recensioni';
    const brand=document.getElementById('brand'),logo=document.getElementById('logo');
    if(data.logo_url){logo.src=data.logo_url}else{brand.classList.add('hidden')}
    const review=document.getElementById('review');
    review.href=data.link_standard||'#';
    loading.remove();
    document.getElementById('page').hidden=false;
  }catch(err){loading.className='loading error';loading.innerHTML='<div><strong>Tapreputa</strong>'+(err.message||'Link non disponibile.')+'</div>'}
})();
</script>
</body>
</html>
