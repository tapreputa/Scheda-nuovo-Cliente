========== */\n\n.recensione {\n\n    justify-self: center;\n\n    width: 100%;\n\n    max-width: 100%;\n\n    min-width: 0;\n\n    display: flex;\n\n    flex-direction: column;\n\n    align-items: center;\n\n    gap: 19px;\n\n    margin-bottom:\n        clamp(\n            44px,\n            7vh,\n            78px\n        );\n}\n\n\n\n/* =====================================================\n   PULSANTE GOOGLE\n===================================================== */\n\n.bottone-google {\n\n    position: relative;\n\n    min-width:\n        min(86vw, 340px);\n\n    height: 72px;\n\n    padding:\n        0 42px;\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    overflow: hidden;\n\n    border:\n        1px solid\n        rgba(255,235,205,0.95);\n\n    border-radius:\n        16px;\n\n    background:\n\n        linear-gradient(\n            180deg,\n            #fffaf3 0%,\n            #f7e4cc 50%,\n            #e6bd90 100%\n        );\n\n    color:\n        #3b1c0d;\n\n    box-shadow:\n\n        0 18px 40px\n        rgba(0,0,0,0.45),\n\n        0 0 26px\n        rgba(210,125,45,0.25),\n\n        inset\n        0 1px 0\n        rgba(255,255,255,0.9);\n\n    font-size:\n        clamp(\n            1.35rem,\n            3vw,\n            1.65rem\n        );\n\n    font-weight: 800;\n\n    text-decoration: none;\n\n    -webkit-tap-highlight-color:\n        transparent;\n\n    transition:\n\n        transform 0.2s ease,\n\n        box-shadow 0.2s ease;\n}\n\n\n.bottone-google:active {\n\n    transform:\n        scale(0.97);\n}\n\n\n\n/* =====================================================\n   RIFLESSO ANIMATO\n===================================================== */\n\n.bottone-google::before {\n\n    content: \"\";\n\n    position: absolute;\n\n    width: 100px;\n\n    height: 160%;\n\n    left: -140px;\n\n    top: -30%;\n\n    transform:\n        rotate(18deg);\n\n    background:\n\n        linear-gradient(\n            90deg,\n
