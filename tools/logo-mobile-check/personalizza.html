<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica editor mobile · ambiente dimostrativo</title><style>body{margin:8px;background:#ddd;font:14px Arial}button{padding:8px;margin-right:6px}iframe{display:block;border:0;background:#fff;margin-top:8px}</style></head><body><button onclick="resize(360,780)">360 × 780</button><button onclick="resize(390,844)">390 × 844</button><button onclick="resize(320,568)">320 × 568</button><button onclick="resize(740,390)">Orizzontale</button><button onclick="final()">Confronta finale</button><button onclick="reset()">Riapri editor</button><span>Ambiente dimostrativo: nessuna modifica al database.</span><iframe id="qa-viewport" title="Schermo telefono" width="360" height="780"></iframe><script>const f=document.getElementById("qa-viewport");function resize(w,h){f.width=w;f.height=h;}function final(){const html=f.contentWindow.QAPublished?.html;if(html){f.removeAttribute("src");f.srcdoc=html;}}function reset(){f.removeAttribute("srcdoc");f.src="fixture/personalizza.html"+location.search;}reset();</script></body></html>
