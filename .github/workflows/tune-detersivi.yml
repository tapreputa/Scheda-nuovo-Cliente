name: Tune Detersivi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch personalizza
        shell: python
        run: |
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text(encoding='utf-8')
          old='detersivi: {file:"Sfondodetersivi.jpg", title:"Hai trovato tutto ciò che cercavi?", accent:"#1fa9b8", accent2:"#0b6f7d", theme:"#0d7884", box:"rgba(255,255,255,.84)", text:"#123b42", message:"La tua opinione ci aiuta a migliorare assortimento, qualità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!"}'
          new='detersivi: {file:"Sfondodetersivi.jpg", title:"Hai trovato tutto ciò che cercavi?", accent:"#1fa9b8", accent2:"#0b6f7d", theme:"#0d7884", box:"rgba(255,255,255,.84)", text:"#123b42", message:"La tua opinione ci aiuta a migliorare assortimento, qualità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-18px)", footerSize:"9px", footerStrong:"18px"}'
          if old not in s:
              raise SystemExit('Config detersivi non trovata')
          s=s.replace(old,new,1)
          old2='.pagina{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(6px,env(safe-area-inset-top)) 16px 110px}'
          new2='.pagina{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(6px,env(safe-area-inset-top)) 16px 110px;transform:${cfg.shift || "none"}}'
          if old2 not in s:
              raise SystemExit('Stile pagina non trovato')
          s=s.replace(old2,new2,1)
          old3='footer{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));margin:0;font-size:11px;font-weight:650;color:#fff;text-align:right;text-shadow:0 3px 10px rgba(0,0,0,.95)}footer strong{display:block;color:#fff;font-size:23px;line-height:1.05;font-weight:950;letter-spacing:.02em}'
          new3='footer{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));margin:0;font-size:${cfg.footerSize || "11px"};font-weight:650;color:#fff;text-align:right;text-shadow:0 3px 10px rgba(0,0,0,.95)}footer strong{display:block;color:#fff;font-size:${cfg.footerStrong || "23px"};line-height:1.05;font-weight:950;letter-spacing:.02em}'
          if old3 not in s:
              raise SystemExit('Stile footer non trovato')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html
          git commit -m "Rifinisci layout Detersivi" || true
          git push
