name: Applica tema premium Tap NFC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-premium-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collega tema premium alle pagine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = ['index.html','clienti.html','personalizza.html','risultati.html','login.html']
          link = '<link rel="stylesheet" href="tap-premium-theme.css?v=1">'
          for name in files:
              p = Path(name)
              s = p.read_text()
              if link not in s:
                  if '</head>' not in s:
                      raise SystemExit(f'head non trovato in {name}')
                  s = s.replace('</head>', link + '\n</head>', 1)
              # Aggiorna esclusivamente il colore UI del browser/WebView.
              import re
              s = re.sub(r'<meta name="theme-color" content="#[0-9A-Fa-f]{6}">', '<meta name="theme-color" content="#07152b">', s, count=1)
              p.write_text(s)
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add index.html clienti.html personalizza.html risultati.html login.html
          git commit -m "Applica restyling premium blu e gold all app"
          git push
