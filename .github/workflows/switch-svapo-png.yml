name: Usa PNG Svapo Store
on:
  push:
    paths:
      - '.github/workflows/switch-svapo-png.yml'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna riferimento immagine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          old='Sfondosvapostore.jpg'
          count=s.count(old)
          assert count >= 1, f'riferimento non trovato: {count}'
          s=s.replace(old,'Sfondosvapostore.png')
          p.write_text(s)
          print('riferimenti aggiornati:', count)
          PY
      - name: Salva e pulisci
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/switch-svapo-png.yml
          git add personalizza.html
          git commit -m "Usa PNG definitivo per Svapo Store"
          git push
