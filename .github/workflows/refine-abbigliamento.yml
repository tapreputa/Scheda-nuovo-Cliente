name: Rifinisce categoria Abbigliamento
on:
  push:
    paths:
      - '.github/workflows/refine-abbigliamento.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rifinisce layout Abbigliamento
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          old='previewHtml = buildPremiumTemplate(logoDataUrl, reviewUrl, backgroundDataUrl, {title:"Il tuo stile merita 5 stelle?", accent:"#c79762", accent2:"#8c623d", theme:"#3a2b22", box:"rgba(24,19,16,.62)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno stile, assortimento e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-4px)", footerSize:"8px", footerStrong:"16px"});'
          new=old+'\n      previewHtml = previewHtml.replace("</head>", `<style id="abbigliamento-layout-v2">.logo,.logo-wrap,.logo-box,.logo-container{background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:none!important;filter:none!important}.logo{padding:0!important;border-radius:0!important;max-height:108px!important;width:auto!important;object-fit:contain!important}.logo-wrap:before,.logo-wrap:after,.logo-box:before,.logo-box:after,.logo-container:before,.logo-container:after{display:none!important}.pagina{padding-top:18px!important}.logo{margin-bottom:118px!important}h1,.title,.titolo{margin-top:0!important;margin-bottom:14px!important}.message,.testo,.review-message{margin-top:0!important}</style>` + "</head>");'
          if old not in s: raise SystemExit('Blocco Abbigliamento non trovato')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Pubblica e pulisci
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/refine-abbigliamento.yml
          git add personalizza.html
          git commit -m "Rifinisce layout Abbigliamento"
          git push origin main
