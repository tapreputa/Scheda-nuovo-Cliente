name: Simplify step indicator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-step-indicator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch phase indicator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          css_path = Path('tap-premium-polish.css')
          css = css_path.read_text(encoding='utf-8')
          block = base64.b64decode('').decode('utf-8')
          start = css.find('/* Flusso operativo definitivo: 1. Attività → 2. Personalizza */')
          end = css.find('/* Ordine header coerente su tutte le pagine */')
          if start != -1 and end != -1 and end > start:
              css = css[:start] + block + css[end:]
          elif '/* Indicatore fase minimale: solo numero corrente */' not in css:
              marker = '/* Ordine header coerente su tutte le pagine */'
              css = css.replace(marker, block + marker)
          css_path.write_text(css, encoding='utf-8')
          for filename in ('index.html','personalizza.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace('tap-premium-polish.css?v=6', 'tap-premium-polish.css?v=7')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add tap-premium-polish.css index.html personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Sostituisci flusso con indicatore fase minimale"
          git push
