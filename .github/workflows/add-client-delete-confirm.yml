name: Elimina cliente con conferma

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-client-delete-confirm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggiorna clienti.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('clienti.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, expected=1):
              global s
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'Replacement non sicuro: attesi {expected}, trovati {n}: {old[:120]!r}')
              s = s.replace(old, new)

          rep('''.open-btn{\n  height:40px;border:0;border-radius:10px;background:#007f69;color:white;\n  padding:0 14px;font-weight:800;cursor:pointer\n}\n.empty''', '''.open-btn{\n  height:40px;border:0;border-radius:10px;background:#007f69;color:white;\n  padding:0 14px;font-weight:800;cursor:pointer\n}\n.row-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}\n.delete-row{\n  width:40px;height:40px;border:1px solid #efc9c4;border-radius:10px;\n  background:#fff7f5;display:grid;place-items:center;cursor:pointer;\n  font-size:17px;line-height:1\n}\n.delete-row:hover{background:#ffece8}\n.confirm-modal{width:min(460px,100%);text-align:center;margin:80px auto}\n.confirm-icon{font-size:38px;margin-bottom:12px}\n.confirm-modal h2{font-size:26px;margin:0 0 12px}\n.confirm-text{margin:0;color:#5f6c68;font-size:15px;line-height:1.55}\n.confirm-name{font-weight:850;color:#17332d}\n.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}\n.confirm-actions button{min-height:54px;border-radius:13px;font:inherit;font-size:15px;font-weight:850;cursor:pointer}\n.confirm-no{border:1px solid #cbd8d4;background:#fff;color:#31544d}\n.confirm-yes{border:1px solid #d66255;background:#b93628;color:#fff}\n.empty''')

          rep('''      <td><button class="open-btn" data-open="${escapeAttr(c.id)}">Apri</button></td>''', '''      <td><div class="row-actions"><button class="open-btn" data-open="${escapeAttr(c.id)}">Apri</button><button class="delete-row" data-delete="${escapeAttr(c.id)}" type="button" title="Elimina cliente" aria-label="Elimina cliente ${escapeAttr(c.nome || c.id)}">❌</button></div></td>''')

          rep('''</div>\n\n<script>\nconst STORAGE_KEY''', '''</div>\n\n<div id="confirmOverlay" class="overlay">\n  <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">\n    <div class="confirm-icon">❌</div>\n    <h2 id="confirmTitle">Eliminare questo cliente?</h2>\n    <p class="confirm-text">Stai per eliminare definitivamente <span id="confirmClientName" class="confirm-name"></span>. Gli ID dei clienti successivi verranno riordinati automaticamente.</p>\n    <div class="confirm-actions">\n      <button id="confirmNo" class="confirm-no" type="button">NO</button>\n      <button id="confirmYes" class="confirm-yes" type="button">SÌ</button>\n    </div>\n  </div>\n</div>\n\n<script>\nconst STORAGE_KEY''')

          rep('''let currentId = null;\n\nconst rows''', '''let currentId = null;\nlet pendingDeleteId = null;\n\nconst rows''')

          rep('''const overlay = document.getElementById("overlay");\n\nfunction save()''', '''const overlay = document.getElementById("overlay");\nconst confirmOverlay = document.getElementById("confirmOverlay");\nconst confirmClientName = document.getElementById("confirmClientName");\n\nfunction save()''')

          rep('''  document.querySelectorAll("[data-open]").forEach(btn => {\n    btn.addEventListener("click", () => openClient(btn.dataset.open));\n  });\n}\n\nfunction openClient''', '''  document.querySelectorAll("[data-open]").forEach(btn => {\n    btn.addEventListener("click", () => openClient(btn.dataset.open));\n  });\n\n  document.querySelectorAll("[data-delete]").forEach(btn => {\n    btn.addEventListener("click", () => openDeleteConfirm(btn.dataset.delete));\n  });\n}\n\nfunction openDeleteConfirm(id){\n  const c = clienti.find(x => x.id === id);\n  if (!c) return;\n  pendingDeleteId = id;\n  confirmClientName.textContent = `${c.nome || "Cliente"} (ID ${c.id})`;\n  overlay.classList.remove("show");\n  confirmOverlay.classList.add("show");\n}\n\nfunction closeDeleteConfirm(){\n  pendingDeleteId = null;\n  confirmOverlay.classList.remove("show");\n}\n\nfunction deleteClientAndRenumber(){\n  if (!pendingDeleteId) return;\n  clienti = clienti\n    .filter(c => c.id !== pendingDeleteId)\n    .sort((a,b) => Number(a.id) - Number(b.id))\n    .map((c, index) => ({...c, id: String(index + 1).padStart(3, "0")}));\n  save();\n  currentId = null;\n  closeDeleteConfirm();\n  render();\n}\n\nfunction openClient''')

          rep('''document.getElementById("delete").onclick = () => {\n  const c=current(); if(!c) return;\n  if(!confirm('Eliminare "' + c.nome + '" dal database?')) return;\n  clienti = clienti.filter(x => x.id !== c.id);\n  save(); overlay.classList.remove("show"); render();\n};''', '''document.getElementById("delete").onclick = () => {\n  const c=current(); if(!c) return;\n  openDeleteConfirm(c.id);\n};\n\ndocument.getElementById("confirmNo").onclick = closeDeleteConfirm;\ndocument.getElementById("confirmYes").onclick = deleteClientAndRenumber;\nconfirmOverlay.addEventListener("click", e => { if(e.target === confirmOverlay) closeDeleteConfirm(); });''')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verifica e pubblica
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('clienti.html').read_text(encoding='utf-8')
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/clienti.js').write_text(s[start:end], encoding='utf-8')
          PY
          node --check /tmp/clienti.js
          git diff --check
          git config user.name "Tapreputa Automation"
          git config user.email "actions@users.noreply.github.com"
          git add clienti.html
          git commit -m "Aggiungi eliminazione cliente confermata e ID sequenziali"
          git push