name: Aggiunge categoria Strumenti musicali
on:
  push:
    paths:
      - '.github/workflows/add-strumenti-musicali.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inserisce categoria
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('personalizza.html')
          s = p.read_text()

          def once(old,new,label):
              global s
              c=s.count(old)
              assert c==1, f'{label}: atteso 1, trovato {c}'
              s=s.replace(old,new,1)

          once('<option value="stabilimento">Stabilimenti balneari</option>\n<option value="svapostore">Svapo Store</option>',
               '<option value="stabilimento">Stabilimenti balneari</option>\n<option value="strumentimusicali">Strumenti musicali</option>\n<option value="svapostore">Svapo Store</option>', 'menu')

          once('    stabilimento: ["Stabilimenti balneari", "Sfondo mare al tramonto + stile tropicale + pulsante premium + 5 stelle + Powered by Tapreputa."],\n',
               '    stabilimento: ["Stabilimenti balneari", "Sfondo mare al tramonto + stile tropicale + pulsante premium + 5 stelle + Powered by Tapreputa."],\n    strumentimusicali: ["Strumenti musicali", "Sfondo negozio di strumenti musicali + stile caldo e deciso + pulsante recensioni + 5 stelle + Powered by Tapreputa."],\n', 'descrizione')

          lines=s.splitlines()
          changed=0
          for i,line in enumerate(lines):
              if '.includes(type)' in line and '"standard"' in line and '"pub"' in line and '"strumentimusicali"' not in line:
                  lines[i]=line.replace('].includes(type)', ',"strumentimusicali"].includes(type)')
                  changed+=1
          assert changed==2, f'liste categorie modificate: {changed}'
          s='\n'.join(lines)+'\n'

          marker='    } else if (type === "svapostore") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondosvapostore.png");\n      previewHtml = buildSvapoStoreTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n'
          c=s.count(marker)
          assert c==1, f'preview marker: {c}'
          insert=marker + '    } else if (type === "strumentimusicali") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondostrumentimusicali.png");\n      previewHtml = buildPremiumTemplate(logoDataUrl, reviewUrl, backgroundDataUrl, {title:"Ti è piaciuta la tua esperienza nel nostro negozio?", accent:"#c9822f", accent2:"#70411f", theme:"#2b1a10", box:"rgba(31,20,12,.66)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno assortimento, consulenza e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-8px)", footerSize:"8px", footerStrong:"16px"});\n'
          s=s.replace(marker,insert,1)

          assert 'value="strumentimusicali"' in s
          assert 'Sfondostrumentimusicali.png' in s
          p.write_text(s)
          PY
      - name: Salva e pulisci
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-strumenti-musicali.yml
          git add personalizza.html
          git commit -m "Aggiunge categoria Strumenti musicali"
          git push
