name: Gelateria No Crop V4

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/gelateria_no_crop_v4.py'
      - '.github/workflows/gelateria-no-crop-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Gelateria no-crop rendering
        run: python3 .github/scripts/gelateria_no_crop_v4.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Elimina crop e zoom sfondo Gelateria"
          git push
