name: Applica categoria Hamburgeria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hamburgeria.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python3 tools/add_hamburgeria.py
      - name: Salva modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git diff --cached --quiet || git commit -m "Aggiunge categoria Hamburgeria"
          git push
