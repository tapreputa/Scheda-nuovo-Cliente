name: Restore Gelateria Original

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore_gelateria_original.py'
      - '.github/workflows/restore-gelateria-original.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Gelateria rendering
        run: python3 .github/scripts/restore_gelateria_original.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Ripristina sfondo originale Gelateria"
          git push
