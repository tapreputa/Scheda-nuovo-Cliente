name: Applica blocco riga cliente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-lock.yml'
      - 'tools/patch_owner_lock.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/patch_owner_lock.py
      - name: Salva modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clienti.html
          git commit -m "Blocca modifica cliente al solo operatore creatore"
          git push
