name: Integra Yogurterie
on:
  push:
    paths:
      - '.github/workflows/add-yogurteria.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python tools/add_yogurteria.py
      - name: Commit
        run: |
          rm .github/workflows/add-yogurteria.yml tools/add_yogurteria.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html .github/workflows/add-yogurteria.yml tools/add_yogurteria.py
          git commit -m 'Yogurterie integra template dedicato' || exit 0
          git push
