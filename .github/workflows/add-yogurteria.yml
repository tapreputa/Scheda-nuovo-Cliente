name: Integra Yogurterie
on:
  push:
    paths: ['.github/workflows/add-yogurteria.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integra categoria Yogurterie
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()

          if '<option value="yogurteria">Yogurterie</option>' not in s:
              s=s.replace('<option value="panificio">Panificio / Biscottificio</option>', '<option value="panificio">Panificio / Biscottificio</option>\n<option value="yogurteria">Yogurterie</option>')

          if 'yogurteria: ["Yogurterie"' not in s:
              s=s.replace('panificio: ["Panificio / Biscottificio", "Sfondo artigianale caldo + layout dedicato senza crop + pulsante recensioni + 5 stelle + Powered by Tapreputa."]', 'panificio: ["Panificio / Biscottificio", "Sfondo artigianale caldo + layout dedicato senza crop + pulsante recensioni + 5 stelle + Powered by Tapreputa."],\n    yogurteria: ["Yogurterie", "Sfondo luminoso turchese + layout fresco dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."]')

          s=s.replace('"centroestetico","panificio"]', '"centroestetico","panificio","yogurteria"]')

          route='''} else if (type === "panificio") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondopanificio.webp");\n      previewHtml = buildPanificioTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n} else if (type === "gelateria") {'''
          if 'type === "yogurteria"' not in s:
              s=s.replace(route, '''} else if (type === "panificio") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondopanificio.webp");\n      previewHtml = buildPanificioTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n    } else if (type === "yogurteria") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondoyogurteria.jpg");\n      previewHtml = buildYogurteriaTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n} else if (type === "gelateria") {''')

          if 'function buildYogurteriaTemplate' not in s:
              marker='function buildGelateriaTemplate'
              builder=r'''function buildYogurteriaTemplate(logoDataUrl, reviewUrl, backgroundDataUrl) {
  return `<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yogurteria · Recensioni</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}body{overflow-x:hidden;background:#dbfbfb;color:#063c46}.scene-original{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;object-position:center center;z-index:0;pointer-events:none;background:#bdeff2}.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(233,255,255,.10) 35%,rgba(0,78,91,.15) 100%);pointer-events:none}.pagina{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:clamp(104px,12vh,160px) 16px max(92px,calc(env(safe-area-inset-bottom) + 76px))}.card{width:min(100%,520px);text-align:center;padding:0 10px 18px}.logo{display:block;width:min(295px,78%);max-height:155px;object-fit:contain;margin:0 auto 18px;padding:8px 12px;border-radius:24px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);filter:drop-shadow(0 8px 18px rgba(0,71,84,.25))}.title{margin:0 auto 14px;max-width:490px;font-size:clamp(27px,5.8vw,40px);line-height:1.05;font-weight:950;letter-spacing:-.025em;color:#063f49;text-shadow:0 2px 12px rgba(255,255,255,.95)}.text{margin:0 auto 20px;max-width:440px;font-size:clamp(15px,3.6vw,19px);line-height:1.42;font-weight:700;color:#0b4f59;text-shadow:0 1px 8px rgba(255,255,255,.95)}.btn{display:inline-flex;align-items:center;justify-content:center;min-width:min(360px,90vw);min-height:62px;padding:0 28px;border-radius:999px;text-decoration:none;background:linear-gradient(135deg,#18bfc5,#0697a5);color:#fff;font-size:18px;font-weight:900;box-shadow:0 12px 28px rgba(0,122,137,.28),inset 0 1px 0 rgba(255,255,255,.35)}.stars{margin:18px 0 0;font-size:32px;letter-spacing:5px;color:#ffc84a;text-shadow:0 2px 6px rgba(73,91,0,.25)}footer{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:3;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.66);backdrop-filter:blur(6px);color:#07515b;font-size:12px;font-weight:800;box-shadow:0 4px 16px rgba(0,77,87,.12)}footer strong{font-weight:950}@media(max-width:640px){.scene-original{object-fit:fill}.pagina{padding-top:clamp(98px,11.5vh,142px);padding-bottom:max(90px,calc(env(safe-area-inset-bottom) + 72px))}.logo{width:min(270px,76%);max-height:145px;margin-bottom:16px}.title{font-size:clamp(26px,7.2vw,35px)}.text{font-size:clamp(15px,4.1vw,18px)}.btn{min-height:58px;font-size:17px}.stars{font-size:29px}}
</style>
</head>
<body>
<img class="scene-original" src="${backgroundDataUrl}" alt="">
<div class="shade"></div>
<main class="pagina"><section class="card"><img class="logo" src="${logoDataUrl}" alt="Logo attività"><h1 class="title">Ti è piaciuta la nostra esperienza yogurt?</h1><p class="text">La tua opinione ci aiuta a creare ogni giorno yogurt, topping e combinazioni ancora più golose. Raccontaci la tua esperienza! Bastano 2 secondi!</p><a class="btn" href="${reviewUrl}" target="_blank" rel="noopener noreferrer">Recensione Google</a><div class="stars">★★★★★</div></section></main><footer>Powered by <strong>Tapreputa</strong></footer>
</body></html>`;
}

'''
              s=s.replace(marker,builder+marker)

          p.write_text(s)
          PY
          rm .github/workflows/add-yogurteria.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html .github/workflows/add-yogurteria.yml
          git commit -m 'Yogurterie: integra template dedicato' || exit 0
          git push