name: Ordina categorie e ricerca clienti v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-search-and-category-order-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica modifiche UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_ui.py
          python3 /tmp/patch_ui.py
          git diff --check
          grep -q 'clienti-live-search-v1' clienti.html
          grep -q 'id="clientSearch"' clienti.html
          grep -q 'value="standard"' personalizza.html
      - name: Salva modifiche
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html clienti.html
          git diff --cached --quiet || git commit -m "Ordina categorie e aggiunge ricerca clienti"
          git push
