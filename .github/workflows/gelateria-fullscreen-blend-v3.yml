name: Gelateria Fullscreen Blend V3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/gelateria_fullscreen_blend_v3.py'
      - '.github/workflows/gelateria-fullscreen-blend-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Gelateria fullscreen refinement
        run: python3 .github/scripts/gelateria_fullscreen_blend_v3.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Adatta Gelateria fullscreen e sfuma logo"
          git push
