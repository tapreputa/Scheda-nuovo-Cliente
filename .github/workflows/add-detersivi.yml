name: Integra Detersivi e casalinghi
on:
  push:
    paths: ['.github/workflows/add-detersivi.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integra categoria Detersivi e casalinghi
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()

          if '<option value="detersivi">Detersivi e casalinghi</option>' not in s:
              s=s.replace('<option value="yogurteria">Yogurterie</option>', '<option value="yogurteria">Yogurterie</option>\n<option value="detersivi">Detersivi e casalinghi</option>')

          if 'detersivi: ["Detersivi e casalinghi"' not in s:
              s=s.replace('yogurteria: ["Yogurterie", "Sfondo luminoso turchese + layout fresco dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."]', 'yogurteria: ["Yogurterie", "Sfondo luminoso turchese + layout fresco dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."],\n    detersivi: ["Detersivi e casalinghi", "Sfondo pulito e luminoso + layout dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."]')

          s=s.replace('"centroestetico","panificio","yogurteria"]', '"centroestetico","panificio","yogurteria","detersivi"]')

          if 'detersivi: {file:"Sfondodetersivi.jpg"' not in s:
              anchor='centroestetico: {file:"Sfondocentroestetico.jpg", title:"Ti è piaciuto il tuo momento di benessere?", accent:"#b58b63", accent2:"#8b6548", theme:"#a57c59", box:"rgba(255,253,249,.70)", text:"#493b31", message:"Il tuo feedback ci aiuta a prenderci cura di ogni dettaglio della tua esperienza. Dicci la tua! Bastano 2 secondi!"}'
              repl=anchor + ',\n        detersivi: {file:"Sfondodetersivi.jpg", title:"Hai trovato tutto ciò che cercavi?", accent:"#1fa9b8", accent2:"#0b6f7d", theme:"#0d7884", box:"rgba(255,255,255,.84)", text:"#123b42", message:"La tua opinione ci aiuta a migliorare assortimento, qualità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!"}'
              s=s.replace(anchor,repl)

          p.write_text(s)
          PY
          rm .github/workflows/add-detersivi.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html .github/workflows/add-detersivi.yml
          git commit -m 'Integra categoria Detersivi e casalinghi' || exit 0
          git push
