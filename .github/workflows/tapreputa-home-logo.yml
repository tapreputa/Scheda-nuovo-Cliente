name: Logo Tapreputa home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tapreputa-home-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserisci logo e collegamento home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64

          logo_b64 = ''
          Path("tapreputa-logo.webp").write_bytes(base64.b64decode(logo_b64))

          files = ["index.html", "personalizza.html", "clienti.html"]
          replacement_icon = '<a class="brand-home" href="index.html" aria-label="Vai alla home"><div class="brand-icon"><img src="tapreputa-logo.webp" alt="Tapreputa"></div></a>'

          for filename in files:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              s, n = re.subn(r'<div class="brand-icon"[^>]*>.*?</div>', replacement_icon, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"Impossibile sostituire brand-icon in {filename}")
              common_css = '''
.brand-home{display:block;flex:0 0 auto;text-decoration:none;border-radius:14px}
.brand-home:focus-visible{outline:3px solid rgba(255,255,255,.72);outline-offset:3px}
.brand-icon{background:#fff!important;overflow:hidden;box-shadow:0 7px 18px rgba(0,0,0,.16)}
.brand-icon img{width:100%;height:100%;display:block;object-fit:contain;padding:5px}
'''
              if ".brand-home{" not in s:
                  s = s.replace("</style>", common_css + "\n</style>", 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Verifica e pubblica
        run: |
          test -s tapreputa-logo.webp
          for f in index.html personalizza.html clienti.html; do
            grep -q 'class="brand-home" href="index.html"' "$f"
            grep -q 'tapreputa-logo.webp' "$f"
          done
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add index.html personalizza.html clienti.html tapreputa-logo.webp
          git commit -m "Sostituisci icona header con logo Tapreputa cliccabile"
          git push
