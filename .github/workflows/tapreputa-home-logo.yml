name: Applica logo Tapreputa

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tapreputa-home-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna intestazioni
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = ['index.html', 'personalizza.html', 'clienti.html']
          replacement = '<a class="brand-home" href="index.html" aria-label="Vai alla home"><div class="brand-icon"><img src="tapreputa-logo.webp" alt="Tapreputa"></div></a>'
          css = "\n.brand-home{display:block;flex:0 0 auto;text-decoration:none;border-radius:14px}\n.brand-home:focus-visible{outline:3px solid rgba(255,255,255,.72);outline-offset:3px}\n.brand-icon{background:#fff!important;overflow:hidden;box-shadow:0 7px 18px rgba(0,0,0,.16)}\n.brand-icon img{width:100%;height:100%;display:block;object-fit:contain;padding:5px}\n"

          for filename in files:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s, n = re.subn(r'<div class="brand-icon"[^>]*>.*?</div>', replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Brand icon non trovato in ' + filename)
              if '.brand-home{' not in s:
                  s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

          test -s tapreputa-logo.webp
          grep -q 'brand-home' index.html
          grep -q 'brand-home' personalizza.html
          grep -q 'brand-home' clienti.html

          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add index.html personalizza.html clienti.html
          git commit -m "Rendi il logo Tapreputa cliccabile verso la home"
          git push
