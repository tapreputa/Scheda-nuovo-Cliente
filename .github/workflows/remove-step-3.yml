name: Remove obsolete step 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-step-3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove step 3 from flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('personalizza.html')]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('grid-template-columns:auto 1fr auto 1fr auto', 'grid-template-columns:auto 1fr auto')
              text = text.replace('<div class="rule"></div><div class="step">3. <span>Consegna</span></div>', '')
              text = text.replace('<div class="rule"></div>\n<div class="step">3. <span>Consegna</span></div>', '')
              text = text.replace('tap-premium-polish.css?v=2', 'tap-premium-polish.css?v=5')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add index.html personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Elimina step 3 da Nuovo cliente e Personalizza"
          git push
