name: Center phase badge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/center-phase-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and compact phase badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          css_path = Path('tap-premium-polish.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Fase premium centrata e compatta */'
          block = base64.b64decode('').decode('utf-8')
          if marker not in css:
              css += block
          css_path.write_text(css, encoding='utf-8')

          for filename in ('index.html','personalizza.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace('tap-premium-polish.css?v=7', 'tap-premium-polish.css?v=8')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add tap-premium-polish.css index.html personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Centra badge fase e riduci spazi verticali"
          git push
