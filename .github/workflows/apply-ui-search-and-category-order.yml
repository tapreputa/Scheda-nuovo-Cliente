name: Ordina categorie e ricerca clienti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-search-and-category-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Applica modifiche UI
        shell: bash
        run: |
          echo ', s, re.S)
if not m:
    raise SystemExit("Selettore activityType non trovato in personalizza.html")

block = m.group(2)
options = re.findall(r'<option\b[^>]*>.*?</option>', block, re.S)
if not options:
    raise SystemExit("Opzioni categorie non trovate")

def opt_value(opt):
    mm = re.search(r'\bvalue="([^"]*)"', opt)
    return mm.group(1) if mm else ""

def opt_label(opt):
    text = re.sub(r'<[^>]+>', '', opt)
    return " ".join(text.split())

placeholder = next((o for o in options if opt_value(o) == ""), None)
standard = next((o for o in options if opt_value(o) == "standard"), None)
if placeholder is None or standard is None:
    raise SystemExit("Placeholder o categoria standard non trovati")

others = [o for o in options if o not in (placeholder, standard)]

def sort_key(opt):
    label = opt_label(opt)
    normalized = unicodedata.normalize("NFKD", label)
    return "".join(ch for ch in normalized if not unicodedata.combining(ch)).casefold()

others.sort(key=sort_key)
new_block = "\n".join([placeholder, standard, *others])
s = s[:m.start(2)] + new_block + s[m.end(2):]
p.write_text(s, encoding="utf-8")

# --- 2) Ricerca live per nome in clienti.html ---
p = Path("clienti.html")
s = p.read_text(encoding="utf-8")

css_marker = "/* clienti-live-search-v1 */"
if css_marker not in s:
    css = r'''
/* clienti-live-search-v1 */
.client-search{display:flex;align-items:center;gap:10px;width:min(520px,100%);margin:-8px 0 20px;padding:0 16px;height:54px;border:1px solid #d2dfdb;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(12,45,39,.06)}
.client-search-icon{font-size:18px;color:#6b7a75;flex:0 0 auto}
.client-search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#17332d;font:inherit;font-size:15px}
.client-search input::placeholder{color:#8a9692}
.client-search:focus-within{border-color:#0c9b80;box-shadow:0 0 0 4px rgba(12,155,128,.10)}
@media(max-width:760px){.client-search{width:100%;margin:-4px 0 16px;height:52px;border-radius:14px}}
'''
    s = s.replace("</style>", css + "\n</style>", 1)

search_html = '''  <div class="client-search" role="search">
    <span class="client-search-icon" aria-hidden="true">⌕</span>
    <input id="clientSearch" type="search" inputmode="search" autocomplete="off" placeholder="Cerca attività per nome…" aria-label="Cerca attività per nome">
  </div>
'''
if 'id="clientSearch"' not in s:
    anchor = '  <div class="headline"><h1>I miei clienti</h1><div id="count" class="count"></div></div>\n'
    if anchor not in s:
        raise SystemExit("Punto inserimento ricerca non trovato")
    s = s.replace(anchor, anchor + search_html, 1)

old_const = "const rows=document.getElementById('rows'),empty=document.getElementById('empty'),tableWrap=document.getElementById('tableWrap'),loading=document.getElementById('loading'),count=document.getElementById('count'),sync=document.getElementById('sync'),overlay=document.getElementById('overlay');"
new_const = "const rows=document.getElementById('rows'),empty=document.getElementById('empty'),tableWrap=document.getElementById('tableWrap'),loading=document.getElementById('loading'),count=document.getElementById('count'),sync=document.getElementById('sync'),overlay=document.getElementById('overlay'),clientSearch=document.getElementById('clientSearch');"
if new_const not in s:
    if old_const not in s:
        raise SystemExit("Dichiarazione elementi DOM non trovata")
    s = s.replace(old_const, new_const, 1)

helper = "const normalizeSearch=s=>String(s??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLocaleLowerCase('it-IT');\n"
if "const normalizeSearch=" not in s:
    anchor = "const dateIt=value=>{if(!value)return '-';const d=new Date(value);return Number.isNaN(d.getTime())?'-':d.toLocaleDateString('it-IT')};\n"
    if anchor not in s:
        raise SystemExit("Punto inserimento helper ricerca non trovato")
    s = s.replace(anchor, anchor + helper, 1)

old_render = '''function render(){
  loading.style.display='none';rows.innerHTML='';count.textContent=clienti.length===1?'1 cliente condiviso':clienti.length+' clienti condivisi';
  if(!clienti.length){tableWrap.style.display='none';empty.classList.add('show');return}
  tableWrap.style.display='';empty.classList.remove('show');
  clienti.forEach(c=>{'''
new_render = '''function render(){
  loading.style.display='none';rows.innerHTML='';
  const query=normalizeSearch(clientSearch?.value||'').trim();
  const visibleClienti=query?clienti.filter(c=>normalizeSearch(c.nome).includes(query)):clienti;
  count.textContent=query
    ? `${visibleClienti.length} ${visibleClienti.length===1?'risultato':'risultati'} su ${clienti.length}`
    : (clienti.length===1?'1 cliente condiviso':clienti.length+' clienti condivisi');
  if(!clienti.length){tableWrap.style.display='none';empty.textContent='Nessun cliente salvato.';empty.classList.add('show');return}
  if(!visibleClienti.length){tableWrap.style.display='none';empty.textContent='Nessuna attività trovata.';empty.classList.add('show');return}
  tableWrap.style.display='';empty.textContent='Nessun cliente salvato.';empty.classList.remove('show');
  visibleClienti.forEach(c=>{'''
if "const visibleClienti=" not in s:
    if old_render not in s:
        raise SystemExit("Funzione render attesa non trovata")
    s = s.replace(old_render, new_render, 1)

listener = "if(clientSearch)clientSearch.addEventListener('input',render);\n"
if "clientSearch.addEventListener('input',render)" not in s:
    anchor = "document.getElementById('close').onclick=()=>overlay.classList.remove('show');"
    if anchor not in s:
        raise SystemExit("Punto inserimento listener ricerca non trovato")
    s = s.replace(anchor, listener + "\n" + anchor, 1)

p.write_text(s, encoding="utf-8")

# Verifiche minime
personalizza = Path("personalizza.html").read_text(encoding="utf-8")
clienti = Path("clienti.html").read_text(encoding="utf-8")
if personalizza.find('value="standard"') > personalizza.find('value="bar"'):
    raise SystemExit("STANDARD non risulta prima delle categorie alfabetiche")
for token in ('clienti-live-search-v1', 'id="clientSearch"', 'const visibleClienti=', "clientSearch.addEventListener('input',render)"):
    if token not in clienti:
        raise SystemExit(f"Verifica fallita: {token}")
' | base64 -d > /tmp/patch_ui.py
          python3 /tmp/patch_ui.py
          git diff --check
          grep -q 'clienti-live-search-v1' clienti.html
          grep -q 'id="clientSearch"' clienti.html
          grep -q 'value="standard"' personalizza.html

      - name: Salva modifiche
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html clienti.html
          git diff --cached --quiet || git commit -m "Ordina categorie e aggiunge ricerca clienti"
          git push
