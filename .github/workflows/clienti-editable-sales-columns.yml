'''function openRename(id){
  const c = clienti.find(x => x.id === id);
  if (!c) return;
  pendingRenameId = id;
  renameInput.value = c.nome || "";
  renameOverlay.classList.add("show");
  setTimeout(() => { renameInput.focus(); renameInput.select(); }, 30);
}

function closeRename(){
  pendingRenameId = null;
  renameOverlay.classList.remove("show");
}

function saveRename(){
  if (!pendingRenameId) return;
  const c = clienti.find(x => x.id === pendingRenameId);
  if (!c) return closeRename();
  const newName = renameInput.value.trim();
  if (!newName) return;
  c.nome = newName;
  save();
  closeRename();
  render();
}

function openLinkActions(id, kind){
  const c = clienti.find(x => x.id === id);
  if (!c) return;
  pendingLinkUrl = kind === "review" ? (c.linkRecensioni || "") : (c.linkNfc || "");
  if (!pendingLinkUrl) return;
  linkActionTitle.textContent = kind === "review" ? "Link recensioni" : "Link NFC";
  linkActionValue.textContent = pendingLinkUrl;
  linkOverlay.classList.add("show");
}

function closeLinkActions(){
  pendingLinkUrl = "";
  linkOverlay.classList.remove("show");
}

