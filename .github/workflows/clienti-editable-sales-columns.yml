'''  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => openDeleteConfirm(btn.dataset.delete));
  });

  document.querySelectorAll("[data-rename]").forEach(btn => {
    btn.addEventListener("click", () => openRename(btn.dataset.rename));
  });

  document.querySelectorAll("[data-link-id]").forEach(btn => {
    btn.addEventListener("click", () => openLinkActions(btn.dataset.linkId, btn.dataset.linkKind));
  });

  document.querySelectorAll("[data-client-field]").forEach(input => {
    input.addEventListener("change", () => {
      const c = clienti.find(x => x.id === input.dataset.id);
      if (!c) return;
      const field = input.dataset.clientField;
      if (input.value === "") {
        c[field] = "";
      } else {
        const n = Number(input.value);
        if (!Number.isFinite(n)) return;
        c[field] = field === "spesa" ? Math.max(0, Math.round(n * 100) / 100) : Math.max(0, Math.floor(n));
        input.value = c[field];
      }
      save();
    });
  });
}''', 'eventi tabella')

