name: Finalize Gelateria Footer

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_gelateria_footer.py'
      - '.github/workflows/finalize-gelateria-footer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Gelateria footer refinement
        run: python3 .github/scripts/finalize_gelateria_footer.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Rifinisce footer Gelateria"
          git push
