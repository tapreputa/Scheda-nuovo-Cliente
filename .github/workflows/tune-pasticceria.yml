name: Tune Pasticceria
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abbassa contenuti Pasticceria
        shell: python
        run: |
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text(encoding='utf-8')
          old='pasticceria: {file:"Sfondopasticceria.jpg", title:"Ti sono piaciute le nostre dolcezze?", accent:"#d58a3a", accent2:"#9b5528", theme:"#6b3d26", box:"rgba(255,250,244,.86)", text:"#4b2d1f", message:"La tua opinione ci aiuta a rendere ogni dolce ancora più speciale. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-10px)", footerSize:"8px", footerStrong:"16px"}'
          new='pasticceria: {file:"Sfondopasticceria.jpg", title:"Ti sono piaciute le nostre dolcezze?", accent:"#d58a3a", accent2:"#9b5528", theme:"#6b3d26", box:"rgba(255,250,244,.86)", text:"#4b2d1f", message:"La tua opinione ci aiuta a rendere ogni dolce ancora più speciale. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(40px)", footerSize:"8px", footerStrong:"16px"}'
          if old not in s:
              raise SystemExit('Config Pasticceria non trovata')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html
          git commit -m "Abbassa layout Pasticceria" || true
          git push
