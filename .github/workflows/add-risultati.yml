name: Aggiungi pulsante Risultati

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-risultati.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserisci collegamento Risultati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clienti.html')
          s=p.read_text(encoding='utf-8')
          if '.results-link-wrap{' not in s:
              css='\n.results-link-wrap{display:flex;justify-content:center;margin:28px 0 0}.results-link{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:250px;min-height:58px;padding:0 26px;border-radius:18px;background:#003c33;color:#fff;text-decoration:none;font-size:16px;font-weight:900;box-shadow:0 14px 30px rgba(0,60,51,.18)}.results-link:active{transform:scale(.98)}.results-link-icon{font-size:20px}@media(max-width:760px){.results-link-wrap{margin-top:24px}.results-link{width:min(82vw,320px);min-height:56px}}\n'
              s=s.replace('</style>',css+'</style>',1)
          if 'href="risultati.html"' not in s:
              needle='</section>\n</main>'
              repl='</section>\n  <div class="results-link-wrap"><a class="results-link" href="risultati.html"><span class="results-link-icon">▥</span><span>Risultati</span></a></div>\n</main>'
              if needle not in s:
                  raise SystemExit('Punto inserimento non trovato')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clienti.html
          git diff --cached --quiet || git commit -m "Aggiungi pulsante Risultati ai clienti"
          git push
