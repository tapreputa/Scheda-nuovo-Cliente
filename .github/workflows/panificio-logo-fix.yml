name: Panificio logo fix
on:
  push:
    paths:
      - '.github/workflows/panificio-logo-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          start=s.index('function buildPanificioTemplate')
          end=s.index('function buildGelateriaTemplate', start)
          block=s[start:end]
          block=block.replace('width:min(220px,62%);max-height:118px','width:min(310px,82%);max-height:170px')
          block=block.replace('width:min(205px,60%);max-height:108px','width:min(285px,80%);max-height:158px')
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/panificio-logo-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html .github/workflows/panificio-logo-fix.yml
          git commit -m 'Panificio: logo più grande' || exit 0
          git push
