name: Wire Excel exporter into results

on:
  push:
    paths:
      - '.github/workflows/apply-risultati-mobile-team-table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add exporter script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('risultati.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="tap-excel-export.js?v=1"></script>'
          if tag not in s:
              s = s.replace('<script src="tap-auth.js"></script>', '<script src="tap-auth.js"></script>\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati.html
          git commit -m "Enable Excel export from results page"
          git push
