name: Refine Gelateria Layout V2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refine_gelateria_layout_v2.py'
      - '.github/workflows/refine-gelateria-layout-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Gelateria layout refinement
        run: python3 .github/scripts/refine_gelateria_layout_v2.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Rifinisce composizione Gelateria senza alterare sfondo"
          git push
