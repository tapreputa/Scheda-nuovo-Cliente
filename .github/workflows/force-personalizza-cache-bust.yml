name: Forza aggiornamento Personalizza

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-personalizza-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forza URL nuova di Personalizza
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="location.href='personalizza.html?'+params.toString()"
          new="params.set('v','20260910-1532');location.href='personalizza.html?'+params.toString()"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Salva modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Force fresh Personalizza load for Bar extra"
          git push
