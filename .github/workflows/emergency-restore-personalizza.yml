name: Integra Bar extra standard

on:
  push:
    branches: [main]
    paths:
      - 'patch_barextra_standard.py'
      - '.github/workflows/emergency-restore-personalizza.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica integrazione Bar extra
        run: python3 patch_barextra_standard.py
      - name: Verifica
        run: |
          grep -q '<option value="barextra">Bar extra</option>' personalizza.html
          grep -q 'Sfondobarextra.webp?v=20260910-2046' personalizza.html
          grep -q 'body,.pagina{background-image:url' personalizza.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git diff --cached --quiet || git commit -m "Fix Bar extra background loading"
          git push
