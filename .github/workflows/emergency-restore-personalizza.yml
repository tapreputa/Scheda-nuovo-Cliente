name: Ripara Bar extra

on:
  push:
    branches: [main]
    paths:
      - 'patch_barextra_standard.py'
      - '.github/workflows/emergency-restore-personalizza.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica riparazione Bar extra
        run: python3 patch_barextra_standard.py
      - name: Salva modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html cliente.html tap-auth.js index.html
          git diff --cached --quiet || git commit -m "Repair Bar extra preview and cache"
          git push
