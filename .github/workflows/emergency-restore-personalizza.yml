name: Ripristina Personalizza stabile con Bar extra

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-personalizza.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ripristina ultima versione stabile e aggiungi solo Bar extra
        run: |
          git show 935bafe499a6cbdbfbdf86a684e5c86e54d6e7d7:personalizza.html > personalizza.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('personalizza.html')
          s = p.read_text(encoding='utf-8')

          bar = '<option value="bar">Bar / Caffetterie</option>'
          extra = '<option value="barextra">Bar extra</option>'
          if extra not in s:
              if bar not in s:
                  raise SystemExit('ERRORE: voce Bar non trovata nel file stabile')
              s = s.replace(bar, bar + '\n' + extra, 1)

          support = '<script src="tap-barextra-bg.js?v=20260910-safe2"></script>\n<script src="tap-barextra.js?v=20260910-safe2"></script>'
          if 'tap-barextra.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('ERRORE: chiusura body non trovata')
              head, tail = s.rsplit('</body>', 1)
              s = head + support + '\n</body>' + tail

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verifica integrità minima
        run: |
          grep -q '<title>Tap NFC · Personalizza</title>' personalizza.html
          grep -q '<option value="bar">Bar / Caffetterie</option>' personalizza.html
          grep -q '<option value="barextra">Bar extra</option>' personalizza.html
          grep -q '<option value="barbershop">Barber Shop</option>' personalizza.html
          grep -q 'tap-barextra.js?v=20260910-safe2' personalizza.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('personalizza.html').read_text(encoding='utf-8')
          if not s.lstrip().startswith('<!doctype html>'):
              raise SystemExit('doctype iniziale mancante')
          if not s.rstrip().endswith('</html>'):
              raise SystemExit('chiusura html finale mancante')
          if s.rfind('tap-barextra.js?v=20260910-safe2') < s.rfind('</script>') - 5000:
              raise SystemExit('supporto Bar extra non in coda pagina')
          PY
      - name: Commit ripristino
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git commit -m "Restore stable Personalizza and add Bar extra safely"
          git push
