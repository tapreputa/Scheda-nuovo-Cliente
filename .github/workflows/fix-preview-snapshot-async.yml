name: Fix Preview Snapshot Async

on:
  push:
    paths:
      - '.github/workflows/fix-preview-snapshot-async.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_preview_snapshot_async.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tap-template-stability.js tap-veterinario.js
          git diff --cached --quiet || git commit -m "Fix first preview snapshot for async logo processing"
          git push
