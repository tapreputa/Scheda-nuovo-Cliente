name: Applica resta connesso e landscape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remember-landscape.yml'
      - 'tools/patch_remember_landscape.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/patch_remember_landscape.py
      - name: Salva modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tap-auth.js login.html
          git commit -m "Aggiunge resta connesso e supporto landscape"
          git push
