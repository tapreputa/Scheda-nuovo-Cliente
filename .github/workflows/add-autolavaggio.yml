name: Aggiunge categoria Autolavaggio
on:
  push:
    paths:
      - '.github/workflows/add-autolavaggio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aggiunge Autolavaggio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          reps=[
          ('<option value="bar">Bar / Caffetterie</option>', '<option value="autolavaggio">Autolavaggio</option>\n<option value="bar">Bar / Caffetterie</option>'),
          ('bar: ["Bar / Caffetterie",', 'autolavaggio: ["Autolavaggio", "Sfondo autolavaggio moderno + logo integrato nell’insegna superiore + pulsante recensioni + 5 stelle + Powered by Tapreputa."],\n    bar: ["Bar / Caffetterie",'),
          ('["standard","bar","ristorante"', '["standard","autolavaggio","bar","ristorante"'),
          ('} else if (type === "strumentimusicali") {', '} else if (type === "autolavaggio") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondoautolavaggio.png");\n      previewHtml = buildPremiumTemplate(logoDataUrl, reviewUrl, backgroundDataUrl, {title:"La tua auto splende come merita?", accent:"#1687c8", accent2:"#075a92", theme:"#063e63", box:"rgba(5,31,48,.60)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno qualità, cura e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(30px)", footerSize:"8px", footerStrong:"16px"});\n      previewHtml = previewHtml.replace("</head>", `<style id="autolavaggio-logo-insegna">.logo{position:fixed!important;z-index:8!important;top:6.8vh!important;left:50%!important;transform:translateX(-50%)!important;width:min(48vw,245px)!important;height:clamp(54px,9vh,82px)!important;max-height:none!important;object-fit:contain!important;margin:0!important;padding:4px 12px!important;border-radius:7px!important;background:rgba(7,20,28,.78)!important;border:1px solid rgba(255,255,255,.16)!important;box-shadow:0 4px 12px rgba(0,0,0,.30)!important;backdrop-filter:blur(2px)!important;-webkit-backdrop-filter:blur(2px)!important}@media(max-width:640px){.logo{top:7.2vh!important;width:min(50vw,215px)!important;height:clamp(50px,8.5vh,72px)!important}}@media(max-width:340px) and (max-height:600px){.logo{top:7vh!important;width:170px!important;height:52px!important}}.pagina{padding-top:clamp(145px,21vh,190px)!important}</style>` + "</head>");\n    } else if (type === "strumentimusicali") {')
          ]
          for a,b in reps:
              n=s.count(a)
              if n < 1: raise SystemExit(f'pattern missing: {a[:60]}')
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Pubblica e pulisci
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-autolavaggio.yml
          git add personalizza.html
          git commit -m "Aggiunge categoria Autolavaggio"
          git push origin main
