name: Applica operatore e brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/applica-operatore-brand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna interfaccia e database clienti
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit('Pattern non trovato: ' + label)
              return text.replace(old, new, 1)

          brand_css = "\n/* tapreputa-brand-v2 */\n.brand-home{display:block;flex:0 0 auto;text-decoration:none;border-radius:16px}\n.brand-icon{width:58px!important;height:58px!important;border-radius:15px!important;background:#fff!important;overflow:hidden!important;box-shadow:0 8px 20px rgba(0,0,0,.18)!important;padding:0!important}\n.brand-icon img{width:100%!important;height:100%!important;display:block!important;object-fit:contain!important;padding:0!important;margin:0!important}\n.brand-sub strong{color:#fff;font-weight:900}\n@media(max-width:760px){.brand-icon{width:50px!important;height:50px!important;border-radius:13px!important}}\n"

          for filename in ['index.html','personalizza.html','clienti.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('<div class="brand-sub">Gestione clienti</div>', '<div class="brand-sub">Powered by <strong>Tapreputa</strong></div>', 1)
              s = s.replace('src="tapreputa-logo.webp"', 'src="tapreputa-logo.webp?v=2"', 1)
              if '/* tapreputa-brand-v2 */' not in s:
                  s = s.replace('</style>', brand_css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('personalizza.html')
          s = p.read_text(encoding='utf-8')

          if 'id="operatorSelect"' not in s:
              old = '<div class="field">\n<label for="activityType">Tipologia di attività</label>'
              new = '<div class="field">\n<label for="operatorSelect">Operatore</label>\n<select id="operatorSelect">\n<option value="" selected disabled>Seleziona operatore</option>\n<option value="Francesco">Francesco</option>\n<option value="Gisberto">Gisberto</option>\n</select>\n</div>\n\n<div class="field">\n<label for="activityType">Tipologia di attività</label>'
              s = once(s, old, new, 'menu operatore')

          if 'const operatorSelect = document.getElementById("operatorSelect");' not in s:
              s = once(s, 'const activityType = document.getElementById("activityType");', 'const operatorSelect = document.getElementById("operatorSelect");\nconst activityType = document.getElementById("activityType");', 'const operatore')

          if 'const incomingOperator = incomingParams.get("operator");' not in s:
              s = once(s, 'const incomingCategory = incomingParams.get("category");', 'const incomingCategory = incomingParams.get("category");\nconst incomingOperator = incomingParams.get("operator");', 'parametro operatore')
              s = once(s, 'if (incomingReviewUrl) {', 'if (incomingOperator) {\n  operatorSelect.value = incomingOperator;\n}\n\nif (incomingReviewUrl) {', 'preselezione operatore')

          if 'Seleziona l’operatore.' not in s:
              s = once(s, '  if (!type) return warn("Seleziona la tipologia di attività.");', '  if (!operatorSelect.value) return warn("Seleziona l’operatore.");\n  if (!type) return warn("Seleziona la tipologia di attività.");', 'validazione operatore')

          if 'const operatorValue = operatorSelect.value || "";' not in s:
              s = once(s, '  const categoryCode = activityType.value || "";', '  const categoryCode = activityType.value || "";\n  const operatorValue = operatorSelect.value || "";', 'valore operatore salvataggio')
              s = once(s, '  if (!businessName) return warn("Nome attività non disponibile.");', '  if (!operatorValue) return warn("Seleziona l’operatore.");\n  if (!businessName) return warn("Nome attività non disponibile.");', 'validazione salvataggio operatore')

          if 'existing.operatore = operatorValue;' not in s:
              s = once(s, '    existing.nome = businessName;', '    existing.nome = businessName;\n    existing.operatore = operatorValue;', 'aggiornamento operatore cliente')

          if '    operatore: operatorValue,' not in s:
              s = once(s, '    nome: businessName,', '    nome: businessName,\n    operatore: operatorValue,', 'nuovo cliente operatore')

          p.write_text(s, encoding='utf-8')

          p = Path('clienti.html')
          s = p.read_text(encoding='utf-8')

          if '<th>OPERATORE</th>' not in s:
              s = once(s, '<th>ID</th><th>NOME</th><th>CATEGORIA</th>', '<th>ID</th><th>NOME</th><th>OPERATORE</th><th>CATEGORIA</th>', 'colonna operatore header')

          if 'class="operator"' not in s:
              s = once(s, '</button></td><td class="category">${escapeHtml(c.categoria||"-")}</td>', '</button></td><td class="operator">${escapeHtml(c.operatore||"-")}</td><td class="category">${escapeHtml(c.categoria||"-")}</td>', 'colonna operatore righe')

          if 'id="mOperator"' not in s:
              s = once(s, '<div class="detail"><b>ID</b><div id="mId"></div></div><div class="detail"><b>Categoria</b>', '<div class="detail"><b>ID</b><div id="mId"></div></div><div class="detail"><b>Operatore</b><div id="mOperator"></div></div><div class="detail"><b>Categoria</b>', 'operatore scheda cliente')

          if 'mOperator.textContent=c.operatore||"-";' not in s:
              s = once(s, 'mId.textContent=c.id||"";mCategory.textContent=', 'mId.textContent=c.id||"";mOperator.textContent=c.operatore||"-";mCategory.textContent=', 'operatore apertura scheda')

          if 'p.set("operator",c.operatore)' not in s:
              s = once(s, 'if(c.categoriaCodice)p.set("category",c.categoriaCodice);location.href=', 'if(c.categoriaCodice)p.set("category",c.categoriaCodice);if(c.operatore)p.set("operator",c.operatore);location.href=', 'operatore modifica cliente')

          if '/* operator-column-v1 */' not in s:
              s = s.replace('</style>', '\n/* operator-column-v1 */\ntd.operator{min-width:110px;font-weight:750;color:#31544d}\n\n</style>', 1)
              s = s.replace('min-width:1240px', 'min-width:1350px', 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'Powered by <strong>Tapreputa</strong>' index.html
          grep -q 'id="operatorSelect"' personalizza.html
          grep -q 'operatore: operatorValue' personalizza.html
          grep -q '<th>OPERATORE</th>' clienti.html
          grep -q 'id="mOperator"' clienti.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html personalizza.html clienti.html
          git diff --cached --quiet || git commit -m "Aggiungi operatore e aggiorna brand Tapreputa"
          git push
