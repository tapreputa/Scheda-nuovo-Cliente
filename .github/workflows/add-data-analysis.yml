name: Aggiungi analisi dati categorie

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-data-analysis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna risultati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('risultati.html')
          s=p.read_text()
          css=base64.b64decode('').decode()
          mobile=base64.b64decode('').decode()
          html=base64.b64decode('').decode()
          js=base64.b64decode('').decode()
          if '.analysis-section{' not in s:
              s=s.replace('\n@media(max-width:760px)','\n'+css+'\n@media(max-width:760px)',1)
          if mobile not in s:
              s=s.replace('@media(max-width:430px){',mobile+'@media(max-width:430px){',1)
          html_anchor='<div id="monthlyEmpty" class="monthly-empty"></div>\n</div>\n</section>\n</div>\n</main>'
          if '<section class="analysis-section">' not in s:
              s=s.replace(html_anchor,html,1)
          js_anchor='function render(clienti){allClients=clienti;renderTotals(clienti);renderYears();renderMonthButtons();renderMonthly();'
          if 'function renderCategoryAnalysis(clienti)' not in s:
              s=s.replace(js_anchor,js+js_anchor.replace('renderMonthly();','renderMonthly();renderCategoryAnalysis(clienti);'),1)
          p.write_text(s)
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add risultati.html
          git commit -m "Aggiungi analisi dati categorie clienti"
          git push
