name: Aggiorna brand Tap NFC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-logo-inline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sostituisci Targa NFC con Tap NFC in tutte le pagine
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          files = ['index.html','personalizza.html','clienti.html']
          for filename in files:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('Targa NFC', 'Tap NFC')
              p.write_text(s, encoding='utf-8')
          PY
          ! grep -R -n --include='*.html' 'Targa NFC' .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html personalizza.html clienti.html
          git diff --cached --quiet || git commit -m "Sostituisci Targa NFC con Tap NFC in tutte le pagine"
          git push
