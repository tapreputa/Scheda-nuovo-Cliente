name: Aggiunge categoria Hamburgeria
on:
  push:
    paths:
      - '.github/workflows/add-hamburgeria.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aggiunge Hamburgeria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          reps=[
          ('<option value="gelateria">Gelateria</option>', '<option value="gelateria">Gelateria</option>\n<option value="hamburgeria">Hamburgeria</option>'),
          ('gelateria: ["Gelateria",', 'hamburgeria: ["Hamburgeria", "Sfondo fotografico hamburger premium + layout dedicato + pulsante recensioni + 5 stelle + Powered by Tapreputa."],\n    gelateria: ["Gelateria",'),
          ('"gelateria",', '"gelateria","hamburgeria",'),
          ('} else if (type === "autolavaggio") {', '} else if (type === "hamburgeria") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondohamburgeria.png");\n      previewHtml = buildPremiumTemplate(logoDataUrl, reviewUrl, backgroundDataUrl, {title:"Ti è piaciuto il nostro burger?", accent:"#d88b28", accent2:"#9b4f12", theme:"#3b1d0d", box:"rgba(24,12,7,.58)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno gusto, qualità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-4px)", footerSize:"8px", footerStrong:"16px"});\n      previewHtml = previewHtml.replace("</head>", `<style id="hamburgeria-logo-clean">.logo,.logo-wrap,.logo-box,.logo-container{background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:none!important;filter:none!important}.logo{padding:0!important;border-radius:0!important}.logo-wrap:before,.logo-wrap:after,.logo-box:before,.logo-box:after,.logo-container:before,.logo-container:after{display:none!important}</style>` + "</head>");\n    } else if (type === "autolavaggio") {')
          ]
          for a,b in reps:
              if a not in s: raise SystemExit('pattern missing: '+a[:60])
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Pubblica e pulisci
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-hamburgeria.yml
          git add personalizza.html
          git commit -m "Aggiunge categoria Hamburgeria"
          git push origin main
