name: Fix step 2 and header order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-step2-header-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('tap-premium-polish.css')
          css = css_path.read_text(encoding='utf-8')

          old = '''html[data-tap-page="index.html"] .steps > .rule:nth-child(4),
          html[data-tap-page="personalizza.html"] .steps > .rule:nth-child(4),
          html[data-tap-page="index.html"] .steps > .step:last-child,
          html[data-tap-page="personalizza.html"] .steps > .step:last-child{
            display:none!important;
          }
          '''
          css = css.replace(old, '')

          marker = '/* Evita qualsiasi animazione se richiesta dal sistema */'
          addition = '''/* Ordine header coerente su tutte le pagine */
          .top-actions .clients-top{order:1!important}
          .top-actions .chat-top{order:2!important}
          .top-actions .logout{order:3!important}

          '''
          if addition.strip() not in css:
              css = css.replace(marker, addition + marker)

          css_path.write_text(css, encoding='utf-8')

          for filename in ('index.html','personalizza.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace('tap-premium-polish.css?v=5', 'tap-premium-polish.css?v=6')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add tap-premium-polish.css index.html personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Ripristina step 2 e uniforma ordine header"
          git push
