name: Apply Bar Extra Client Editor

on:
  push:
    paths:
      - 'tools/add_barextra_to_client_editor.py'
      - '.github/workflows/apply-barextra-client-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/add_barextra_to_client_editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
          else
            git add tap-clienti-tools.js
            git commit -m "Add Bar Extra to saved client category editor"
            git push
          fi
