name: Corregge sfondo Svapo Store
on:
  push:
    paths:
      - '.github/workflows/fix-svapo-bg.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decodifica sfondo corretto
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib
          data = '''[... ELLIPSIZATION ...]'''
          raw = base64.b64decode(data)
          assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9'
          pathlib.Path('Sfondosvapostore.jpg').write_bytes(raw)
          PY
      - name: Salva correzione e rimuovi workflow temporaneo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sfondosvapostore.jpg
          git rm .github/workflows/fix-svapo-bg.yml
          git commit -m 'Corregge sfondo Svapo Store'
          git push
