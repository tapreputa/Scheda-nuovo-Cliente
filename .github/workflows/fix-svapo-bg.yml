name: Corregge sfondo Svapo Store
on:
  push:
    paths:
      - '.github/workflows/fix-svapo-bg.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ripristina JPEG corretto
        shell: bash
        run: |
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d > Sfondosvapostore.jpg
          test "$(head -c 2 Sfondosvapostore.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 Sfondosvapostore.jpg | xxd -p)" = "ffd9"
      - name: Salva correzione e rimuovi workflow temporaneo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sfondosvapostore.jpg
          git rm .github/workflows/fix-svapo-bg.yml
          git commit -m 'Corregge sfondo Svapo Store'
          git push
