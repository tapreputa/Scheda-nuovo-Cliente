name: Adjust review link flow

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/adjust_review_link_flow.py'
      - '.github/workflows/adjust-review-link-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply review link flow changes
        run: python3 .github/scripts/adjust_review_link_flow.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add index.html personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Semplifica pagina 1 e ripristina link recensioni in Personalizza"
          git push
