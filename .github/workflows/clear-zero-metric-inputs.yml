name: Svuota zero campi numerici

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-zero-metric-inputs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna campi numerici clienti
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('clienti.html')
          s = p.read_text()
          old = "    i.onchange=()=>{const f=i.dataset.field;let v=Number(i.value||0);if(!Number.isFinite(v))v=0;v=f==='spesa'?Math.max(0,Math.round(v*100)/100):Math.max(0,Math.floor(v));i.value=v;patchField(i.dataset.id,f,v)};"
          new = "    i.onfocus=()=>{if(Number(i.value)===0)i.value=''};\n    i.onblur=()=>{if(String(i.value).trim()==='')i.value='0'};\n    i.onchange=()=>{const f=i.dataset.field;let v=Number(i.value||0);if(!Number.isFinite(v))v=0;v=f==='spesa'?Math.max(0,Math.round(v*100)/100):Math.max(0,Math.floor(v));i.value=v;patchField(i.dataset.id,f,v)};"
          if old not in s:
              raise SystemExit('Blocco onchange non trovato')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add clienti.html
          git commit -m "Svuota automaticamente lo zero nei campi numerici"
          git push
