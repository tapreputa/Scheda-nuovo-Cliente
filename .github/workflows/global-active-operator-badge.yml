name: Operatore attivo globale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-active-operator-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica operatore globale
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tap-auth.js')
          s = p.read_text()
          old = "    const name = operatorName(user);\n    document.querySelectorAll('[data-operator-name], .user-pill').forEach(el => {"
          new = "    const name = operatorName(user);\n    document.body.dataset.tapOperator = name || '';\n    const operatorHost = document.querySelector('main');\n    if (operatorHost) operatorHost.dataset.tapOperator = name || '';\n    document.querySelectorAll('[data-operator-name], .user-pill').forEach(el => {"
          if new not in s:
              if old not in s:
                  raise SystemExit('decoratePage non trovato')
              s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('landscape.css')
          c = css.read_text()
          marker = '/* TAP ACTIVE OPERATOR */'
          if marker not in c:
              c += '''\n\n/* TAP ACTIVE OPERATOR */\nmain[data-tap-operator]{position:relative}\nmain[data-tap-operator]::after{content:"🔥 " attr(data-tap-operator);position:absolute;top:18px;right:24px;z-index:40;white-space:nowrap;color:#003c33;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1;font-weight:900;letter-spacing:.01em;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.9)}\n@media(max-width:760px){main[data-tap-operator]::after{top:16px;right:18px;font-size:14px}}\n@media(orientation:landscape) and (max-height:680px){main[data-tap-operator]::after{top:10px;right:20px;font-size:13px}}\n'''
              css.write_text(c)

          r = Path('risultati.html')
          if r.exists():
              x = r.read_text()
              import re
              x = re.sub(r'\.logged-operator\{[^}]*\}\.logged-operator span\{[^}]*\}', '', x, count=1)
              x = re.sub(r'\.logged-operator\{justify-content:flex-start;margin:-12px 0 18px;font-size:14px\}', '', x, count=1)
              x = x.replace('\n<div class="logged-operator">🔥 <span data-operator-name>Operatore</span></div>', '', 1)
              r.write_text(x)
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add tap-auth.js landscape.css risultati.html
          git commit -m "Mostra operatore loggato su tutte le pagine"
          git push
