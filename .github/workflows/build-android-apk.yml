name: Build Tap NFC APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK privata Tap NFC
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepara APK
        run: |
          mkdir -p android/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/apk/Tap-NFC.apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Tap-NFC
          path: android/apk/Tap-NFC.apk
          if-no-files-found: error
          retention-days: 30
