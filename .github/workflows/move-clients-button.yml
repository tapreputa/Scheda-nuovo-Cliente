name: Sposta pulsante I miei clienti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-clients-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggiorna index e personalizza
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: attesa 1 corrispondenza, trovate {count}')
              return text.replace(old, new, 1)

          # ---------- index.html ----------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              '''    .user-pill{\n      border:1px solid rgba(255,255,255,.14);\n      background:rgba(255,255,255,.08);\n      border-radius:999px;padding:13px 20px;\n      font-size:15px;font-weight:650\n    }''',
              '''    .user-pill{\n      border:1px solid rgba(255,255,255,.14);\n      background:rgba(255,255,255,.08);\n      border-radius:999px;padding:13px 20px;\n      font-size:15px;font-weight:650\n    }\n    .top-actions{display:flex;align-items:center;gap:12px}\n    .clients-top{\n      display:inline-flex;align-items:center;justify-content:center;gap:8px;\n      min-height:46px;padding:0 18px;border:1px solid rgba(255,255,255,.30);\n      border-radius:999px;background:#fff;color:#003c33;text-decoration:none;\n      font-size:14px;font-weight:850;white-space:nowrap;\n      box-shadow:0 8px 22px rgba(0,0,0,.12)\n    }''',
              'CSS top index'
          )

          s = replace_once(
              s,
              '''      .user-pill{padding:10px 14px;font-size:13px}\n      .wrap{padding:34px 18px 55px}''',
              '''      .user-pill{padding:10px 14px;font-size:13px}\n      .clients-top{min-height:42px;padding:0 14px;font-size:13px}\n      .top-actions{gap:8px}\n      .wrap{padding:34px 18px 55px}''',
              'mobile index'
          )

          s = replace_once(
              s,
              '''  <div class="user-pill">Francesco Terreno</div>\n</header>''',
              '''  <div class="top-actions">\n    <a class="clients-top" href="clienti.html">👥 I miei clienti</a>\n    <div class="user-pill">Francesco Terreno</div>\n  </div>\n</header>''',
              'header index'
          )

          s = replace_once(
              s,
              '''\n  <a class="clients-link" href="clienti.html">\n    👥 I miei clienti\n  </a>\n</main>''',
              '''\n</main>''',
              'link fondo index'
          )

          # elimina CSS vecchio del pulsante in fondo
          old_css = '''  \n    .clients-link{\n      display:flex;\n      align-items:center;\n      justify-content:center;\n      gap:9px;\n      width:100%;\n      min-height:60px;\n      margin-top:18px;\n      padding:0 20px;\n      border:1px solid #0a8e75;\n      border-radius:16px;\n      background:#effaf7;\n      color:#08735f;\n      text-decoration:none;\n      font-size:16px;\n      font-weight:800;\n    }\n'''
          if old_css in s:
              s = s.replace(old_css, '', 1)

          p.write_text(s, encoding='utf-8')

          # ---------- personalizza.html ----------
          p = Path('personalizza.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              '.user-pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:999px;padding:13px 20px;font-size:15px;font-weight:650}',
              '.user-pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:999px;padding:13px 20px;font-size:15px;font-weight:650}.top-actions{display:flex;align-items:center;gap:12px}.clients-top{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:1px solid rgba(255,255,255,.30);border-radius:999px;background:#fff;color:#003c33;text-decoration:none;font-size:14px;font-weight:850;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.12)}',
              'CSS top personalizza'
          )

          s = replace_once(
              s,
              '.user-pill{display:none} .wrap{padding:34px 18px 55px}',
              '.user-pill{display:none} .clients-top{min-height:42px;padding:0 14px;font-size:13px}.top-actions{gap:8px} .wrap{padding:34px 18px 55px}',
              'mobile personalizza'
          )

          s = replace_once(
              s,
              '<div class="user-pill">Francesco Terreno</div>\n</header>',
              '<div class="top-actions"><a class="clients-top" href="clienti.html">👥 I miei clienti</a><div class="user-pill">Francesco Terreno</div></div>\n</header>',
              'header personalizza'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verifica e pubblica
        shell: bash
        run: |
          git diff --check
          grep -q 'class="clients-top" href="clienti.html"' index.html
          grep -q 'class="clients-top" href="clienti.html"' personalizza.html
          test "$(grep -c 'class="clients-link" href="clienti.html"' index.html)" -eq 0
          git config user.name "Tapreputa Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html personalizza.html
          git commit -m "Porta I miei clienti in alto su entrambe le pagine"
          git push