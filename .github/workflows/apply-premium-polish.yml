name: Applica rifiniture premium Tap NFC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-premium-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collega rifiniture premium alle pagine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['index.html','clienti.html','personalizza.html','risultati.html','login.html']
          link = '<link rel="stylesheet" href="tap-premium-polish.css?v=2">'
          for name in files:
              p = Path(name)
              s = p.read_text()
              if link in s:
                  continue
              anchor = '<link rel="stylesheet" href="tap-premium-theme.css?v=1">'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n' + link, 1)
              elif '</head>' in s:
                  s = s.replace('</head>', link + '\n</head>', 1)
              else:
                  raise SystemExit(f'head non trovato in {name}')
              p.write_text(s)
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add index.html clienti.html personalizza.html risultati.html login.html
          git commit -m "Applica rifiniture premium mobile all app"
          git push
