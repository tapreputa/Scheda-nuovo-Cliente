name: Rimuove pannello logo Strumenti musicali
on:
  push:
    paths:
      - '.github/workflows/fix-strumenti-logo.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corregge solo logo Strumenti musicali
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text()
          old='''      previewHtml = buildPremiumTemplate(logoDataUrl, reviewUrl, backgroundDataUrl, {title:"Ti è piaciuta la tua esperienza nel nostro negozio?", accent:"#c9822f", accent2:"#70411f", theme:"#2b1a10", box:"rgba(31,20,12,.66)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno assortimento, consulenza e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-8px)", footerSize:"8px", footerStrong:"16px"});'''
          css='<style id="strumenti-logo-clean">.logo{background:transparent!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0!important;border-radius:0!important;filter:none!important}</style>'
          new=old + '\n      previewHtml = previewHtml.replace("</head>", ' + repr(css) + ' + "</head>");'
          assert s.count(old)==1, f'blocco strumenti trovato {s.count(old)} volte'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Pubblica e pulisci
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-strumenti-logo.yml
          git add personalizza.html
          git commit -m "Rimuove pannello attorno al logo Strumenti musicali"
          git push
