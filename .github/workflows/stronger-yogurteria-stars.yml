name: Migliora contrasto stelle Yogurteria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stronger-yogurteria-stars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendi più evidente la pill delle stelle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('personalizza.html')
          text = p.read_text(encoding='utf-8')

          start = text.find('function buildYogurteriaTemplate(')
          end = text.find('function buildGelateriaTemplate(', start)
          if start < 0 or end < 0:
              raise SystemExit('Template Yogurteria non trovato')

          before = text[:start]
          block = text[start:end]
          after = text[end:]
          original = block

          base_css = '.stars{display:inline-flex;align-items:center;justify-content:center;margin:12px auto 0;padding:6px 10px;border-radius:999px;background:rgba(4,72,82,.44);border:1px solid rgba(255,255,255,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 5px 14px rgba(0,58,69,.20);font-size:28px;line-height:1;letter-spacing:3px;color:#ffc43d;text-shadow:0 2px 5px rgba(54,38,0,.48)}'
          block, n1 = re.subn(r'\.stars\{display:inline-flex;[^}]*\}', base_css, block, count=1)

          mobile_css = '.stars{font-size:25px;padding:6px 9px;margin-top:10px;letter-spacing:3px}'
          block, n2 = re.subn(r'\.stars\{font-size:25px;[^}]*\}', mobile_css, block, count=1)

          tiny_css = '.stars{margin-top:9px!important;font-size:23px!important;line-height:1!important;padding:5px 8px!important;letter-spacing:2px!important}'
          block, n3 = re.subn(r'\.stars\{margin-top:9px!important;font-size:23px!important;line-height:1!important;[^}]*\}', tiny_css, block, count=1)

          if not (n1 == 1 and n2 == 1 and n3 == 1):
              raise SystemExit(f'Patch incompleta: base={n1}, mobile={n2}, tiny={n3}')
          if block == original:
              raise SystemExit('Nessuna modifica applicata')

          p.write_text(before + block + after, encoding='utf-8')
          PY

      - name: Salva modifica e rimuovi workflow temporaneo
        run: |
          rm -f .github/workflows/stronger-yogurteria-stars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html .github/workflows/stronger-yogurteria-stars.yml
          git commit -m "Aumenta contrasto stelle Yogurteria"
          git push
