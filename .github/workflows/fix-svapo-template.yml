name: Corregge template Svapo Store
on:
  push:
    paths:
      - '.github/workflows/fix-svapo-template.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica template dedicato
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_svapo.py
          python /tmp/patch_svapo.py
      - name: Salva e pulisci
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-svapo-template.yml
          git add personalizza.html
          git commit -m "Usa template dedicato per Svapo Store"
          git push
