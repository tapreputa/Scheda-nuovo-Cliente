name: Apply NFC tap analytics

on:
  push:
    paths:
      - '.github/workflows/apply-nfc-tap-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject analytics bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '<script src="tap-nfc-analytics-ui.js?v=1"></script>'
          for name in ['clienti.html', 'personalizza.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if tag in text:
                  continue
              pos = text.rfind('</body>')
              if pos < 0:
                  raise SystemExit(f'No closing body in {name}')
              text = text[:pos] + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clienti.html personalizza.html
          git commit -m "Enable NFC tap analytics in app"
          git push origin main
