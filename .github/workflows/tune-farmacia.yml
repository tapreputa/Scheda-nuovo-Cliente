name: Tune Farmacia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Riduci footer Farmacia
        shell: python
        run: |
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text(encoding='utf-8')
          old='farmacia: {file:"Sfondofarmacia.jpg", title:"La tua esperienza è importante per noi", accent:"#16a085", accent2:"#0b6f61", theme:"#0b7668", box:"rgba(255,255,255,.88)", text:"#16473f", message:"La tua opinione ci aiuta a migliorare ogni giorno accoglienza, disponibilità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-10px)", footerSize:"9px", footerStrong:"18px"}'
          new='farmacia: {file:"Sfondofarmacia.jpg", title:"La tua esperienza è importante per noi", accent:"#16a085", accent2:"#0b6f61", theme:"#0b7668", box:"rgba(255,255,255,.88)", text:"#16473f", message:"La tua opinione ci aiuta a migliorare ogni giorno accoglienza, disponibilità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-10px)", footerSize:"8px", footerStrong:"16px"}'
          if old not in s:
              raise SystemExit('Config Farmacia non trovata')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html
          git commit -m "Riduci footer Farmacia" || true
          git push
