name: Migliora tabella I miei clienti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-clienti-sticky.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica modifica tabella clienti
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_clienti.py
          python3 /tmp/patch_clienti.py
          grep -q 'clienti-sticky-columns-v1' clienti.html
          grep -q 'Elimina definitivamente' clienti.html

      - name: Salva modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clienti.html
          git diff --cached --quiet || git commit -m "Compatta e blocca ID e nome nella tabella clienti"
          git push
