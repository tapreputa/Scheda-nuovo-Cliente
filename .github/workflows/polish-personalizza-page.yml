name: Polish Personalizza page

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/polish_personalizza.py'
      - '.github/workflows/polish-personalizza-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Personalizza cleanup
        run: python3 .github/scripts/polish_personalizza.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Semplifica Personalizza e correggi footer anteprima"
          git push
