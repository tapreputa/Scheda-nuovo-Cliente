name: Polish Personalizza page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-personalizza-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Personalizza UI and preview footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('personalizza.html')
          text = p.read_text(encoding='utf-8')

          # 1) Operatore: resta solo come controllo tecnico nascosto per non cambiare la logica.
          pattern = re.compile(r'<div class="field">\s*<label for="operatorSelect">Operatore</label>\s*<select id="operatorSelect">.*?</select>\s*</div>', re.S)
          replacement = '''<select id="operatorSelect" hidden aria-hidden="true">
<option value="" selected disabled>Seleziona operatore</option>
<option value="Francesco">Francesco</option>
<option value="Gisberto">Gisberto</option>
</select>'''
          text, n = pattern.subn(replacement, text, count=1)
          assert n == 1, 'Campo operatore non trovato'

          # 2) Card descrittiva template -> indicazione minimale della sola tipologia selezionata.
          pattern = re.compile(r'<div class="template-info" id="templateInfo">.*?</div>', re.S)
          text, n = pattern.subn('<div class="selected-type" id="templateInfo" hidden></div>', text, count=1)
          assert n == 1, 'Card templateInfo non trovata'

          old = 'if (item) templateInfo.innerHTML = `<strong>${item[0]} — TEMPLATE MASTER ATTIVO</strong><span>${item[1]}</span>`;'
          new = '''if (item) {
    templateInfo.hidden = false;
    templateInfo.innerHTML = `<span>Tipologia selezionata</span><strong>${item[0]}</strong>`;
  } else {
    templateInfo.hidden = true;
    templateInfo.innerHTML = "";
  }'''
          assert old in text, 'Logica templateInfo non trovata'
          text = text.replace(old, new, 1)

          # 3) Link recensioni Google: resta come dato nascosto, alimentato dalla pagina 1.
          pattern = re.compile(r'<div class="field">\s*<label for="destinationUrl">Link recensioni Google</label>\s*<input id="destinationUrl"[^>]*>\s*<div class="hint">.*?</div>\s*</div>', re.S)
          text, n = pattern.subn('<input id="destinationUrl" type="hidden">', text, count=1)
          assert n == 1, 'Campo link recensioni non trovato'

          # Stile minimale per la tipologia selezionata, senza card.
          css_marker = '.template-info strong{display:block;margin-bottom:6px} .template-info span{color:#6f7c78;font-size:14px;line-height:1.5}\n'
          css_add = '''.selected-type{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-4px 2px 24px;padding:0;color:#6f7c78}.selected-type[hidden]{display:none!important}.selected-type span{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7c8798}.selected-type strong{font-size:17px;font-weight:850;color:#0b2142;text-align:right}\n'''
          assert css_marker in text, 'Punto CSS template-info non trovato'
          text = text.replace(css_marker, css_marker + css_add, 1)

          # 4) Solo anteprima: solleva Powered by Tapreputa sopra la navigation bar Android.
          old = '  const frame = document.getElementById("tapPreviewFrame");\n  frame.srcdoc = previewHtml;'
          new = '''  const frame = document.getElementById("tapPreviewFrame");
  const previewSafeFooterStyle = `<style id="tap-preview-safe-footer">
    @media (max-width:760px){
      footer{
        bottom:max(82px,calc(env(safe-area-inset-bottom) + 68px))!important;
        right:max(18px,env(safe-area-inset-right))!important;
        z-index:999!important;
        max-width:calc(100vw - 36px)!important;
      }
    }
    @media (orientation:landscape) and (max-height:680px){
      footer{bottom:max(58px,calc(env(safe-area-inset-bottom) + 46px))!important;z-index:999!important}
    }
  </style>`;
  if (previewHtml.includes("</head>")) previewHtml = previewHtml.replace("</head>", previewSafeFooterStyle + "</head>");
  frame.srcdoc = previewHtml;'''
          assert old in text, 'openInlinePreview non trovato'
          text = text.replace(old, new, 1)

          # Forza refresh del CSS condiviso.
          text = re.sub(r'tap-premium-polish\.css\?v=\d+', 'tap-premium-polish.css?v=9', text, count=1)

          p.write_text(text, encoding='utf-8')

          # Sanity checks
          out = p.read_text(encoding='utf-8')
          assert '<label for="operatorSelect">Operatore</label>' not in out
          assert 'TEMPLATE MASTER ATTIVO' not in out
          assert '<label for="destinationUrl">Link recensioni Google</label>' not in out
          assert 'previewSafeFooterStyle' in out
          assert 'Tipologia selezionata' in out
          PY
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Semplifica Personalizza e correggi footer anteprima"
          git push
