name: Fix Yogurteria route
on:
  push:
    paths:
      - '.github/workflows/fix-yogurteria-route.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('personalizza.html')
          s = p.read_text()
          old = '''    } else if (type === "panificio") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondopanificio.webp");\n      previewHtml = buildPanificioTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n    } else if (type === "gelateria") {'''
          new = '''    } else if (type === "panificio") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondopanificio.webp");\n      previewHtml = buildPanificioTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n    } else if (type === "yogurteria") {\n      const backgroundDataUrl = await loadBackgroundDataUrl("Sfondoyogurteria.jpg");\n      previewHtml = buildYogurteriaTemplate(logoDataUrl, reviewUrl, backgroundDataUrl);\n    } else if (type === "gelateria") {'''
          if old not in s:
              raise SystemExit('Blocco routing atteso non trovato')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-yogurteria-route.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html .github/workflows/fix-yogurteria-route.yml
          git commit -m 'Correggi anteprima Yogurterie'
          git push
