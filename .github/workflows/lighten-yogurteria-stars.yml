name: Schiarisce pill stelle Yogurteria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighten-yogurteria-stars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schiarisci leggermente la pill delle stelle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('personalizza.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('function buildYogurteriaTemplate')
          end = text.index('function buildGelateriaTemplate', start)
          chunk = text[start:end]

          pattern = r'(\.stars\{[^{}]*?background:)rgba\([^)]*\)'
          replacement = r'\1rgba(20,108,117,.54)'
          new_chunk, count = re.subn(pattern, replacement, chunk, count=1)
          if count != 1:
              raise SystemExit(f'Attesa 1 sostituzione background stelle Yogurteria, trovate {count}')

          text = text[:start] + new_chunk + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Salva modifica e rimuovi workflow temporaneo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lighten-yogurteria-stars.yml
          git add personalizza.html
          git commit -m "Schiarisce pill stelle Yogurteria"
          git push
