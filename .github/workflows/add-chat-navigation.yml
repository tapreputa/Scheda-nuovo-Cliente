name: Add Tap NFC chat navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-chat-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collega chat a tutte le pagine protette
        run: python3 .github/scripts/patch_chat_nav.py
      - name: Pubblica modifica
        run: |
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add tap-auth.js
          git commit -m "Collega chat interna a tutte le pagine"
          git push
