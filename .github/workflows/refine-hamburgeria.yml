name: Rifinitura Hamburgeria
on:
  push:
    paths: ['.github/workflows/refine-hamburgeria.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/refine_hamburgeria.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git commit -m "Allinea Hamburgeria al riferimento approvato"
          git push origin main
# reference-layout
