name: Patch Archivio Logo Manage

on:
  push:
    paths:
      - '.github/workflows/patch-archivio-logo-manage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_archivio_logo_manage.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivio-logo.js archivio-logo.css archivio-logo.html
          git diff --cached --quiet || git commit -m "Add rename and delete to logo archive"
          git push
