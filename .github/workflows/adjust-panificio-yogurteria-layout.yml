name: Affina layout Panificio e Yogurterie

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-panificio-yogurteria-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Affina i due template dedicati
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('personalizza.html')
          text = path.read_text(encoding='utf-8')

          def patch_block(source, start_marker, end_marker, replacements, label):
              if start_marker not in source or end_marker not in source:
                  raise SystemExit(f'Blocco {label} non trovato')
              before, tail = source.split(start_marker, 1)
              block, after = tail.split(end_marker, 1)
              original = block
              for old, new in replacements:
                  if old not in block:
                      raise SystemExit(f'{label}: stringa attesa non trovata: {old[:90]}')
                  block = block.replace(old, new, 1)
              if block == original:
                  raise SystemExit(f'{label}: nessuna modifica applicata')
              return before + start_marker + block + end_marker + after

          text = patch_block(
              text,
              'function buildPanificioTemplate',
              'function buildYogurteriaTemplate',
              [
                  (
                      'padding:clamp(112px,13.5vh,185px) 16px max(92px,calc(env(safe-area-inset-bottom) + 76px))',
                      'padding:clamp(58px,7vh,92px) 16px max(92px,calc(env(safe-area-inset-bottom) + 76px))'
                  ),
                  (
                      '.pagina{padding-top:clamp(105px,13vh,150px);padding-bottom:max(88px,calc(env(safe-area-inset-bottom) + 72px))}',
                      '.pagina{padding-top:clamp(42px,5.5vh,68px);padding-bottom:max(88px,calc(env(safe-area-inset-bottom) + 72px))}'
                  ),
              ],
              'Panificio'
          )

          text = patch_block(
              text,
              'function buildYogurteriaTemplate',
              'function buildGelateriaTemplate',
              [
                  (
                      'background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(233,255,255,.10) 35%,rgba(0,78,91,.15) 100%)',
                      'background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(233,255,255,.08) 42%,rgba(255,255,255,.02) 72%,rgba(255,255,255,0) 100%)'
                  ),
                  (
                      'padding:clamp(28px,4.5vh,56px) 16px max(92px,calc(env(safe-area-inset-bottom) + 76px))',
                      'padding:clamp(14px,2.2vh,28px) 16px max(92px,calc(env(safe-area-inset-bottom) + 76px))'
                  ),
                  (
                      '.card{width:min(100%,520px);text-align:center;padding:0 10px 18px}',
                      '.card{width:min(100%,520px);text-align:center;padding:0 10px 8px}'
                  ),
                  (
                      '.logo{display:block;width:min(295px,78%);max-height:155px;object-fit:contain;margin:0 auto 18px;padding:8px 12px;',
                      '.logo{display:block;width:min(260px,70%);max-height:128px;object-fit:contain;margin:0 auto 10px;padding:6px 10px;'
                  ),
                  (
                      '.title{margin:0 auto 14px;max-width:490px;font-size:clamp(27px,5.8vw,40px);',
                      '.title{margin:0 auto 9px;max-width:480px;font-size:clamp(25px,5.2vw,35px);'
                  ),
                  (
                      '.text{margin:0 auto 20px;max-width:440px;font-size:clamp(15px,3.6vw,19px);line-height:1.42;',
                      '.text{margin:0 auto 12px;max-width:430px;font-size:clamp(14px,3.2vw,17px);line-height:1.34;'
                  ),
                  (
                      'border-radius:18px;padding:14px 16px;box-shadow:0 8px 22px rgba(0,77,87,.16);',
                      'border-radius:18px;padding:11px 14px;box-shadow:0 8px 22px rgba(0,77,87,.16);'
                  ),
                  (
                      'min-height:62px;padding:0 28px;border-radius:999px;text-decoration:none;background:linear-gradient(135deg,#18bfc5,#0697a5);color:#fff;font-size:18px;',
                      'min-height:54px;padding:0 24px;border-radius:999px;text-decoration:none;background:linear-gradient(135deg,#18bfc5,#0697a5);color:#fff;font-size:17px;'
                  ),
                  (
                      '.stars{margin:18px 0 0;font-size:32px;',
                      '.stars{margin:10px 0 0;font-size:28px;'
                  ),
                  (
                      '.pagina{padding-top:clamp(24px,4vh,44px);padding-bottom:max(90px,calc(env(safe-area-inset-bottom) + 72px))}',
                      '.pagina{padding-top:clamp(10px,1.8vh,18px);padding-bottom:max(90px,calc(env(safe-area-inset-bottom) + 72px))}'
                  ),
                  (
                      '.logo{width:min(270px,76%);max-height:145px;margin-bottom:16px}',
                      '.logo{width:min(232px,66%);max-height:114px;margin-bottom:7px}'
                  ),
                  (
                      '.title{font-size:clamp(26px,7.2vw,35px)}',
                      '.title{font-size:clamp(23px,6.4vw,30px);margin-bottom:8px}'
                  ),
                  (
                      '.text{font-size:clamp(15px,4.1vw,18px)}',
                      '.text{font-size:clamp(13.5px,3.7vw,16px);line-height:1.30;padding:10px 12px;margin-bottom:10px}'
                  ),
                  (
                      '.btn{min-height:58px;font-size:17px}',
                      '.btn{min-height:50px;font-size:16px}'
                  ),
                  (
                      '.stars{font-size:29px}',
                      '.stars{font-size:25px}'
                  ),
              ],
              'Yogurterie'
          )

          checks = [
              'padding:clamp(58px,7vh,92px)',
              'padding-top:clamp(42px,5.5vh,68px)',
              'width:min(232px,66%)',
              'font-size:clamp(13.5px,3.7vw,16px)',
              'rgba(255,255,255,0) 100%'
          ]
          for check in checks:
              if check not in text:
                  raise SystemExit(f'Verifica finale fallita: {check}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Salva la modifica e rimuovi il workflow temporaneo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git rm .github/workflows/adjust-panificio-yogurteria-layout.yml
          git commit -m "Affina layout Panificio e Yogurterie"
          git push
