name: Rifinisce stelle Yogurteria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-yogurteria-stars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rifinisci pill stelle Yogurteria
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('personalizza.html')
          text = p.read_text(encoding='utf-8')

          old_main = '.stars{display:inline-flex;align-items:center;justify-content:center;margin:12px auto 0;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.58);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 6px 16px rgba(0,77,87,.14);font-size:28px;line-height:1;letter-spacing:5px;color:#ffc43d;text-shadow:0 2px 5px rgba(91,68,0,.42)}'
          new_main = '.stars{display:inline-flex;align-items:center;justify-content:center;margin:12px auto 0;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.48);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 6px 16px rgba(0,77,87,.12);font-size:28px;line-height:1;letter-spacing:5px;color:#ffc43d;text-shadow:0 2px 5px rgba(91,68,0,.42)}'
          old_mobile = '.stars{font-size:25px;padding:7px 13px;margin-top:10px}'
          new_mobile = '.stars{font-size:25px;padding:6px 10px;margin-top:10px}'
          old_tiny = '.stars{margin-top:9px!important;font-size:23px!important;line-height:1!important;padding:6px 11px!important}'
          new_tiny = '.stars{margin-top:9px!important;font-size:23px!important;line-height:1!important;padding:5px 9px!important}'

          for old, new, label in [
              (old_main, new_main, 'desktop'),
              (old_mobile, new_mobile, 'mobile'),
              (old_tiny, new_tiny, 'tiny')
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Blocco {label} trovato {count} volte; modifica interrotta')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Salva modifica e rimuovi workflow temporaneo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-yogurteria-stars.yml
          git add personalizza.html
          git commit -m "Rifinisce stelle Yogurteria"
          git push
