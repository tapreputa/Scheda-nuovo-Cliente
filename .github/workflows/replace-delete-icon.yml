name: Sostituisci icona eliminazione

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-delete-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sostituisci simbolo X con cestino
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('clienti.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('❌', '🗑️')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q '🗑️' clienti.html
      - name: Salva modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clienti.html
          git diff --cached --quiet || git commit -m "Usa icona cestino per eliminare i clienti"
          git push
