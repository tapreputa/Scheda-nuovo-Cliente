name: Applica QA definitiva anteprime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preview-definitive.yml'
      - 'tools/patch_preview_definitive.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica revisione definitiva anteprime
        run: python tools/patch_preview_definitive.py
      - name: Salva modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git commit -m "Rende definitive le anteprime categoria su portrait e landscape"
          git push
