name: Test Tap NFC internal chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-internal-chat.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi JavaScript
        run: |
          node --check tap-auth.js
          node --check chat.js
      - name: Verifica file e collegamenti chat
        run: |
          test -s chat.html
          test -s chat.css
          test -s chat-nav.css
          grep -q "chat.html" tap-auth.js
          grep -q "refreshChatBadge" tap-auth.js
          grep -q "tapnfc-chat" chat.js
          grep -q "supabase-js" chat.html
      - name: Verifica assenza service role frontend
        run: |
          ! grep -Rni --include='*.js' --include='*.html' "service_role\|service-role" . --exclude-dir=.git
