name: Standard Custom NFC Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/standard_custom_nfc_flow.py'
      - '.github/workflows/standard-custom-nfc-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply NFC flow update
        run: python3 .github/scripts/standard_custom_nfc_flow.py
      - name: Commit changes
        run: |
          git config user.name "tapreputa"
          git config user.email "tapreputa@gmail.com"
          git add personalizza.html
          git diff --cached --quiet && exit 0
          git commit -m "Gestisci link NFC standard e personalizzato"
          git push
