name: Integra Pasticceria
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch personalizza
        shell: python
        run: |
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text(encoding='utf-8')

          if '<option value="pasticceria">Pasticcerie</option>' not in s:
              s=s.replace('<option value="fitness">Palestre / Fitness</option>', '<option value="fitness">Palestre / Fitness</option>\n<option value="pasticceria">Pasticcerie</option>', 1)

          meta='    fitness: ["Palestre / Fitness", "Sfondo palestra moderno + stile energico + pulsante recensioni + 5 stelle + Powered by Tapreputa."]'
          if 'pasticceria: ["Pasticcerie"' not in s:
              s=s.replace(meta, meta + ',\n    pasticceria: ["Pasticcerie", "Sfondo elegante e goloso + stile caldo + pulsante recensioni + 5 stelle + Powered by Tapreputa."]', 1)

          s=s.replace('"yogurteria","detersivi","farmacia","fitness"]', '"yogurteria","detersivi","farmacia","fitness","pasticceria"]')

          cfg='        fitness: {file:"Sfondofitness.jpg", title:"Ti è piaciuto allenarti con noi?", accent:"#e45b22", accent2:"#b42f14", theme:"#232323", box:"rgba(20,20,20,.72)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno ambiente, attrezzature e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-12px)", footerSize:"8px", footerStrong:"16px"}'
          if 'pasticceria: {file:"Sfondopasticceria.jpg"' not in s:
              newcfg=cfg + ',\n        pasticceria: {file:"Sfondopasticceria.jpg", title:"Ti sono piaciute le nostre dolcezze?", accent:"#d58a3a", accent2:"#9b5528", theme:"#6b3d26", box:"rgba(255,250,244,.86)", text:"#4b2d1f", message:"La tua opinione ci aiuta a rendere ogni dolce ancora più speciale. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-10px)", footerSize:"8px", footerStrong:"16px"}'
              s=s.replace(cfg,newcfg,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html
          git commit -m "Integra categoria Pasticceria" || true
          git push
