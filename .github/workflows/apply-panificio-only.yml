name: Applica Panificio Biscottificio

on:
  push:
    branches: [panificio-integration]
    paths:
      - '.github/workflows/apply-panificio-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: panificio-integration
      - name: Applica integrazione Panificio
        run: python3 tools/patch_panificio_only.py
      - name: Verifica asset
        run: |
          test -s Sfondopanificio.webp
          grep -q 'value="panificio"' personalizza.html
          grep -q 'buildPanificioTemplate' personalizza.html
      - name: Salva modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Integra categoria Panificio Biscottificio"
          git push origin HEAD:panificio-integration
