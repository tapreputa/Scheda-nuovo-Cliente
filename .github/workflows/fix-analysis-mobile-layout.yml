name: Correggi grafico analisi dati mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-analysis-mobile-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi layout mobile analisi dati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('risultati.html')
          s = p.read_text()
          marker = '/* ANALISI DATI MOBILE FIX */'
          if marker not in s:
              css = '''\n/* ANALISI DATI MOBILE FIX */\n@media(max-width:760px){\n  .analysis-card{overflow:hidden}\n  .category-chart{gap:18px}\n  .category-row{\n    display:grid;\n    grid-template-columns:minmax(0,1fr) auto;\n    grid-template-areas:\"label value\" \"bar bar\";\n    gap:8px 12px;\n    align-items:center;\n    width:100%;\n    min-width:0\n  }\n  .category-label{grid-area:label;min-width:0;display:flex;align-items:center;overflow:visible}\n  .category-rank{flex:0 0 auto;min-width:32px}\n  .category-name{font-size:13px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2;word-break:normal}\n  .category-track{grid-area:bar;width:100%;min-width:0;height:22px}\n  .category-value{grid-area:value;text-align:right;font-size:13px;line-height:1.05;white-space:nowrap;align-self:center}\n  .category-value small{margin-top:3px;font-size:10px}\n}\n@media(max-width:430px){\n  .analysis-card{padding:15px}\n  .category-row{gap:7px 10px}\n  .category-name{font-size:12px}\n  .category-rank{min-width:29px}\n  .category-value{font-size:12px}\n  .category-track{height:20px}\n}\n'''
              if '</style>' not in s:
                  raise SystemExit('Tag style non trovato')
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s)
          PY
          git config user.name "tapreputa-bot"
          git config user.email "tapreputa-bot@users.noreply.github.com"
          git add risultati.html
          git commit -m "Correggi visualizzazione mobile analisi dati"
          git push
