name: Correggi anteprima Tap NFC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-preview-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sostituisci popup anteprima con overlay interno
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          p = Path('personalizza.html')
          s = p.read_text(encoding='utf-8')
          helper = base64.b64decode('').decode('utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('ICAgIG9wZW5JbmxpbmVQcmV2aWV3KHByZXZpZXdIdG1sKTsKCiAgICBtc2cuY2xhc3NOYW1lID0gIm1lc3NhZ2Ugc2hvdyBvayI7CiAgICBtc2cudGV4dENvbnRlbnQgPSAiQW50ZXByaW1hIGFwZXJ0YSBjb3JyZXR0YW1lbnRlLiI7').decode('utf-8')
          marker = 'previewBtn.addEventListener("click", async () => {'
          if 'function openInlinePreview(previewHtml)' not in s:
              if marker not in s:
                  raise SystemExit('Listener anteprima non trovato')
              s = s.replace(marker, helper + marker, 1)
          if old in s:
              s = s.replace(old, new, 1)
          elif 'openInlinePreview(previewHtml);' not in s:
              raise SystemExit('Blocco popup anteprima non trovato')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'function openInlinePreview(previewHtml)' personalizza.html
          grep -q 'openInlinePreview(previewHtml);' personalizza.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personalizza.html
          git diff --cached --quiet || git commit -m "Correggi anteprima con overlay interno"
          git push
