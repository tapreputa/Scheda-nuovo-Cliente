name: Correggi link recensioni Tap NFC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-preview-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi Place ID e apertura pagina recensioni
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) NUOVO CLIENTE: accetta sia Place ID puro sia link completo/nidificato
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = "  document.getElementById('generateBtn').addEventListener('click', () => {"
          helper = r'''  function normalizePlaceIdInput(value) {
    let current = String(value || '').trim();

    for (let i = 0; i < 5; i++) {
      const match = current.match(/[?&]placeid=([^&#]+)/i);
      if (!match) break;

      let next = match[1];
      try { next = decodeURIComponent(next); } catch {}
      next = next.trim();

      if (!next || next === current) break;
      current = next;
    }

    return current;
  }

'''
          if 'function normalizePlaceIdInput(value)' not in s:
              if marker not in s:
                  raise SystemExit('Listener Genera link non trovato in index.html')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              "    const placeIdValue = placeid.value.trim();\n\n    if (!placeIdValue) {",
              "    let placeIdValue = normalizePlaceIdInput(placeid.value);\n\n    if (!placeIdValue) {",
              1
          )

          old = """    reviewUrl = BASE_REVIEW_URL + placeIdValue;\n\n    generatedLink.textContent = reviewUrl;"""
          new = """    if (/^https?:\\/\\//i.test(placeIdValue)) {\n      msg.className = 'message show warn';\n      msg.textContent = 'Il valore inserito non contiene un Place ID valido.';\n      result.classList.remove('show');\n      return;\n    }\n\n    placeid.value = placeIdValue;\n    reviewUrl = BASE_REVIEW_URL + placeIdValue;\n\n    generatedLink.textContent = reviewUrl;"""
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              'placeholder="Es. ChIJ..."',
              'placeholder="Es. ChIJ... oppure incolla il link completo"',
              1
          )

          p.write_text(s, encoding='utf-8')

          # 2) PERSONALIZZA: ripara anche link già duplicati e non mostra falso blocco browser
          p = Path('personalizza.html')
          s = p.read_text(encoding='utf-8')

          params_marker = 'const incomingParams = new URLSearchParams(window.location.search);'
          review_helper = r'''function normalizeReviewUrl(value) {
  const prefix = "https://search.google.com/local/writereview?placeid=";
  let current = String(value || "").trim();

  if (!current) return "";

  if (current.startsWith(prefix)) {
    let placePart = current.slice(prefix.length);
    for (let i = 0; i < 5 && placePart.startsWith(prefix); i++) {
      placePart = placePart.slice(prefix.length);
    }
    return prefix + placePart;
  }

  return current;
}

'''
          if 'function normalizeReviewUrl(value)' not in s:
              if params_marker not in s:
                  raise SystemExit('Parametri iniziali non trovati in personalizza.html')
              s = s.replace(params_marker, review_helper + params_marker, 1)

          s = s.replace(
              '  destinationUrl.value = incomingReviewUrl;',
              '  destinationUrl.value = normalizeReviewUrl(incomingReviewUrl);',
              1
          )

          s = s.replace(
              'const reviewUrl = destinationUrl.value.trim();',
              'const reviewUrl = normalizeReviewUrl(destinationUrl.value);\n  destinationUrl.value = reviewUrl;'
          )

          old_standard = '''  if (type === "standard") {
    const win = window.open(reviewUrl, "_blank", "noopener,noreferrer");
    if (!win) return warn("Il browser ha bloccato l’apertura della pagina recensioni.");
    msg.className = "message show ok";
    msg.textContent = "Pagina recensioni aperta correttamente.";
    return;
  }'''
          new_standard = '''  if (type === "standard") {
    window.open(reviewUrl, "_blank", "noopener,noreferrer");
    msg.className = "message show ok";
    msg.textContent = "Pagina recensioni aperta correttamente.";
    return;
  }'''
          if old_standard in s:
              s = s.replace(old_standard, new_standard, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'function normalizePlaceIdInput(value)' index.html
          grep -q 'function normalizeReviewUrl(value)' personalizza.html
          ! grep -q 'browser ha bloccato l.apertura della pagina recensioni' personalizza.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html personalizza.html
          git diff --cached --quiet || git commit -m "Correggi Place ID duplicato e apertura recensioni"
          git push
