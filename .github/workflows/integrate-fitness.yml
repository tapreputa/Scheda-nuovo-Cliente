name: Integra Fitness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch personalizza
        shell: python
        run: |
          from pathlib import Path
          p=Path('personalizza.html')
          s=p.read_text(encoding='utf-8')

          if '<option value="fitness">Palestre / Fitness</option>' not in s:
              s=s.replace('<option value="farmacia">Farmacie</option>', '<option value="farmacia">Farmacie</option>\n<option value="fitness">Palestre / Fitness</option>', 1)

          meta='    farmacia: ["Farmacie", "Sfondo farmacia luminoso + stile professionale + pulsante recensioni + 5 stelle + Powered by Tapreputa."]'
          if 'fitness: ["Palestre / Fitness"' not in s:
              s=s.replace(meta, meta + ',\n    fitness: ["Palestre / Fitness", "Sfondo palestra moderno + stile energico + pulsante recensioni + 5 stelle + Powered by Tapreputa."]', 1)

          s=s.replace('"yogurteria","detersivi","farmacia"]', '"yogurteria","detersivi","farmacia","fitness"]')

          cfg='        farmacia: {file:"Sfondofarmacia.jpg", title:"La tua esperienza è importante per noi", accent:"#16a085", accent2:"#0b6f61", theme:"#0b7668", box:"rgba(255,255,255,.88)", text:"#16473f", message:"La tua opinione ci aiuta a migliorare ogni giorno accoglienza, disponibilità e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-10px)", footerSize:"8px", footerStrong:"16px"}'
          if 'fitness: {file:"Sfondofitness.jpg"' not in s:
              newcfg=cfg + ',\n        fitness: {file:"Sfondofitness.jpg", title:"Ti è piaciuto allenarti con noi?", accent:"#e45b22", accent2:"#b42f14", theme:"#232323", box:"rgba(20,20,20,.72)", text:"#ffffff", message:"La tua opinione ci aiuta a migliorare ogni giorno ambiente, attrezzature e servizio. Raccontaci la tua esperienza! Bastano 2 secondi!", shift:"translateY(-12px)", footerSize:"8px", footerStrong:"16px"}'
              s=s.replace(cfg,newcfg,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add personalizza.html
          git commit -m "Integra categoria Palestre Fitness" || true
          git push
