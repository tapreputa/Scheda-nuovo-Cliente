<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152b">
<title>Nuovo potenziale · Tapreputa</title>
<link rel="stylesheet" href="tap-global-bottom-nav.css?v=2">
<style>
:root{--navy:#07152b;--blue:#1769ff;--ink:#0a1930;--muted:#718097;--line:#dce4ee;--gold:#d4a328;--green:#08735f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 15% -10%,rgba(23,105,255,.10),transparent 31%),linear-gradient(180deg,#f7f9fd,#eef4f9);padding-bottom:110px;-webkit-font-smoothing:antialiased}
.topbar{min-height:80px;padding:12px 18px;background:linear-gradient(120deg,var(--navy),#0d3468);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 12px 30px rgba(7,21,43,.18);position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px}.brand-link{display:block;width:48px;height:48px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.20)}.brand-link svg{width:100%;height:100%;display:block}.brand-title{font-size:17px;font-weight:950}.brand-sub{font-size:10px;color:#b9c9df;margin-top:3px}.brand-sub strong{color:#f4c95d}.operator{font-size:11px;font-weight:850;padding:9px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08)}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 70px}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}.hero h1{margin:0;font-size:38px;letter-spacing:-.04em}.hero p{margin:8px 0 20px;color:var(--muted);font-size:13px;line-height:1.45}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 48px rgba(20,42,74,.10)}label{display:block;font-size:12px;font-weight:900;margin:0 0 8px;color:#34445a}.search{width:100%;height:56px;border:1.5px solid #cfdae7;border-radius:15px;background:#fff;color:#11243f;padding:0 16px;font:inherit;font-size:15px;outline:none}.search:focus{border-color:#1769ff;box-shadow:0 0 0 4px rgba(23,105,255,.10)}.state{margin-top:9px;padding:10px 12px;border:1px solid #d9e5f3;border-radius:12px;background:#fff;color:#687991;font-size:11px;font-weight:800}.state.ok{border-color:#b9e4d9;background:#effaf7;color:#08705d}.state.warn{border-color:#efd79e;background:#fff9eb;color:#7b5a11}.results{display:none;margin-top:8px;border:1px solid #d7e2ef;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 14px 34px rgba(20,42,74,.13)}.results.open{display:block}.option{width:100%;border:0;border-bottom:1px solid #edf1f6;background:#fff;text-align:left;padding:12px 13px;cursor:pointer}.option:last-child{border-bottom:0}.main{display:block;font-size:12px;font-weight:900;color:#123a68}.secondary{display:block;margin-top:3px;font-size:10px;color:#7d8a9b}.selected{margin-top:18px;padding-top:18px;border-top:1px dashed #d5dfeb}.field{margin-bottom:14px}.value{min-height:50px;border:1.5px solid #cfdae7;border-radius:14px;background:#f8fafc;padding:14px;font-size:12px;color:#304761;word-break:break-all}.primary{width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,#0b4fc2,#1769ff);color:#fff;font:inherit;font-size:14px;font-weight:950;cursor:pointer;box-shadow:0 12px 24px rgba(23,105,255,.22)}.primary:disabled{opacity:.45;cursor:not-allowed}.back{display:inline-block;margin-top:14px;color:#5f7188;font-size:11px;font-weight:850;text-decoration:none}.message{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:11px}.message.show{display:block}.message.warn{background:#fff7e8;color:#7b5410;border:1px solid #f0d6a4}
@media(max-width:760px){.topbar{min-height:74px;padding:10px 13px}.operator{display:none}.wrap{padding:24px 13px 44px}.hero h1{font-size:31px}.hero p{font-size:11px}.card{padding:18px;border-radius:20px}}
</style>
</head>
<body data-auth="required">
<header class="topbar">
  <div class="brand">
    <a class="brand-link" href="index.html" aria-label="Vai alla Home"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="14" fill="#fff"/><path d="M31 12 L88 50 L16 92 L48 56 L66 50 L25 23 Z" fill="#071d35"/><path d="M18 31 L50 50 L39 60 L8 40 Z" fill="#071d35"/><path d="M15 90 L27 57 L39 64 Z" fill="#e6a019"/></svg></a>
    <div><div class="brand-title">Nuovo potenziale</div><div class="brand-sub">Powered by <strong>Tapreputa</strong></div></div>
  </div>
  <div class="operator" data-operator-name>Operatore</div>
</header>
<main class="wrap">
  <section class="hero"><div class="eyebrow">Preparazione commerciale</div><h1>Nuovo potenziale</h1><p>Cerca l’attività su Google. Dopo la selezione passerai alla personalizzazione senza creare ancora un cliente.</p></section>
  <section class="card">
    <label for="prospectSearch">Cerca attività su Google</label>
    <input id="prospectSearch" class="search" type="search" autocomplete="off" placeholder="Es. Maxim Bar Palermo">
    <div id="prospectState" class="state ok">Ricerca pronta. Scrivi almeno 6 caratteri.</div>
    <div id="prospectResults" class="results"></div>
    <div class="selected">
      <div class="field"><label>Nome attività</label><div id="selectedName" class="value">Nessuna attività selezionata</div></div>
      <div class="field"><label>Google Place ID</label><div id="selectedPlace" class="value">—</div></div>
      <button id="continueProspect" class="primary" type="button" disabled>Continua a Personalizza →</button>
      <div id="prospectMsg" class="message"></div>
      <a class="back" href="potenziali.html">← Torna ai potenziali</a>
    </div>
  </section>
</main>
<script src="tap-auth.js?v=4"></script>
<script src="tap-potenziali-entry.js?v=1"></script>
<script src="tap-global-bottom-nav-loader.js?v=3"></script>
</body>
</html>
