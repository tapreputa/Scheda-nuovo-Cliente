<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anteprima cliente · Tapreputa</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f8f7;color:#173d34}main{padding:32px 24px;text-align:center}button{padding:12px 24px;border:0;border-radius:12px;background:#096b59;color:#fff;font:700 16px Arial;cursor:pointer}[hidden]{display:none}
</style>
</head>
<body><main><p id="status" role="status">Apertura della pagina salvata…</p><button id="retry" type="button" hidden>Riprova</button></main>
<script>
(async()=>{
  'use strict';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  retry.addEventListener('click',()=>location.reload());
  try {
    const slug=new URLSearchParams(location.search).get('c')||'';
    if(!/^[a-z0-9-]{1,80}$/.test(slug)) throw new Error('Link non valido.');
    const key='sb_publishable_Hc_FOVPSOkuNC-mz25VknA_5O0fWJ6p';
    // Resolve the saved composition without registering an NFC tap or page view.
    const response=await fetch('https://rqzgdgdoulgjwlxtdxhi.supabase.co/rest/v1/rpc/get_public_manual_logo_page',{
      method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},
      body:JSON.stringify({p_slug:slug})
    });
    if(!response.ok) throw new Error('Impossibile aprire l’anteprima. Riprova.');
    const rows=await response.json();
    if(!Array.isArray(rows) || (rows.length && typeof rows[0]?.html!=='string')) throw new Error('Impossibile aprire l’anteprima. Riprova.');
    const hasSavedComposition=Boolean(rows[0]?.html);
    const destination=new URL(hasSavedComposition?'manual-logo.html':'cliente.html',location.href);
    destination.searchParams.set('c',slug);
    if(!hasSavedComposition){
      destination.searchParams.set('preview','1');
      destination.searchParams.set('v','20261009-preview-parity1');
    }
    location.replace(destination.href);
  } catch(error) {
    status.textContent=error.message==='Link non valido.'?error.message:'Impossibile aprire l’anteprima. Riprova.';
    retry.hidden=false;
  }
})();
</script>
</body></html>
